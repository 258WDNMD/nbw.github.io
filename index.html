function summaryInfoHtml(){
  const cov=summaryCoverage();
  const cfg=DB.summaryCfg||DEFAULT_SUM;
  const parts=[];
  parts.push(`<span class="pill">覆盖 ${cov.count} 章</span>`);
  if(cov.count) parts.push(`<span class="pill">第 ${cov.from}–${cov.to} 章</span>`);
  parts.push(`<span class="pill">${fmt(cov.chars)} 字</span>`);
  parts.push(`<span class="pill">${cfg.mode==='manual'?'手动模式':'自动汇总'}</span>`);

  const missing=[];
  DB.chapters.forEach((ch,i)=>{
    if((ch.content||'').trim() && ch.status!=='待写' && !(ch.sum||'').trim())
      missing.push(i+1);
  });
  let warn='';
  if(missing.length){
    const list=missing.length>8?missing.slice(0,8).join('、')+' 等':missing.join('、');
    warn=`<div class="alert warn" style="margin:8px 0 0;font-size:11.5px;padding:7px 10px">
      第 ${list} 章还没有摘要，未纳入前文摘要。到对应章节点「生成本章摘要」补齐即可。</div>`;
  }
  return `<div class="row" style="gap:5px">${parts.join('')}</div>${warn}`;
}

function nowIso(){ return new Date().toISOString(); }

/* ---- 清空整体摘要 ----
   自动模式下「整体摘要」是各章摘要拼装出来的，所以清空整体摘要 = 清各章摘要 + 手动摘要。
   正文一律不动。清空前留档到 summaryCfg._undo，可一键撤销。 */
function summarizeClearTargets(){
  let chapters=0, chapterChars=0;
  DB.chapters.forEach(ch=>{
    const s=(ch.sum||'').trim();
    if(s){ chapters++; chapterChars+=countWords(s); }
  });
  const manual=(DB.summaryCfg&&DB.summaryCfg.manual||'').trim();
  return {chapters, chapterChars, hasManual:!!manual, manualChars:countWords(manual)};
}
function hasAnySummary(){
  const t=summarizeClearTargets();
  return t.chapters>0 || t.hasManual;
}
function clearAllSummary(){
  const cfg=DB.summaryCfg||(DB.summaryCfg=structuredClone(DEFAULT_SUM));
  // 留档：记录被清掉的每一份摘要，供撤销还原。
  // 仅当此刻确有内容时才更新留档 —— 否则重复点击会用空快照把
  // 上一次有效的留档覆盖掉，导致真正想撤销时无据可依。
  const t=summarizeClearTargets();
  if(t.chapters>0 || t.hasManual){
    cfg._undo={
      at:nowIso(),
      chapters:DB.chapters.map((ch,i)=>({no:i+1, sum:ch.sum||'', sumUpdated:ch.sumUpdated||''}))
                          .filter(x=>x.sum.trim()),
      manual:cfg.manual||''
    };
  }else if(!cfg._undo){
    cfg._undo={at:nowIso(),chapters:[],manual:''};
  }
  DB.chapters.forEach(ch=>{ ch.sum=''; delete ch.sumUpdated; });
  cfg.manual='';
  return cfg._undo;
}
function undoClearSummary(){
  const cfg=DB.summaryCfg||DEFAULT_SUM;
  const u=cfg._undo;
  if(!u) return false;
  const nRec=(u.chapters||[]).length;
  const nMan=(u.manual||'').trim().length;
  // 空快照（无章节摘要也无手动摘要）——没有可还原的东西
  if(!nRec && !nMan){ delete cfg._undo; return false; }
  // 按章号还原（章节可能已被增删，越界的跳过，避免错位）
  let restored=0, skipped=0;
  (u.chapters||[]).forEach(rec=>{
    const ch=DB.chapters[rec.no-1];
    if(ch){ ch.sum=rec.sum; if(rec.sumUpdated) ch.sumUpdated=rec.sumUpdated; restored++; }
    else skipped++;
  });
  if(u.manual) cfg.manual=u.manual;
  delete cfg._undo;
  return {restored,skipped};
}
/* 不依赖 toLocaleString 的 locale 支持（精简 ICU 环境会退化成英文格式） */
function formatClearTime(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d.getTime())) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function finalize(){
  const c=DB.chapters[curChap];
  if(!(c.content||'').trim()){toast('正文为空，无法定稿');return;}

  // 定稿前检查摘要：没摘要会导致后续章节失去上下文
  if(!(c.sum||'').trim()){
    const go=confirm(
      `第 ${curChap+1} 章还没有摘要。\n\n`+
      `前文摘要由各章摘要拼装而成，缺了本章的摘要，`+
      `后续章节生成时就会看不到这一章发生了什么。\n\n`+
      `要先「生成本章摘要」再定稿吗？\n`+
      `（点「取消」仍可继续定稿，之后随时可补）`
    );
    if(go){
      const btn=document.getElementById('btnSummary');
      if(btn) runSummary(btn);
      return;   // 摘要生成完再手动定稿，避免流程交叉
    }
  }

  c.status='已定稿';save();
  const next=DB.chapters[curChap+1];
  log(`第 ${curChap+1} 章已定稿`);
  render();
  toast(next?`第 ${curChap+1} 章已定稿，可继续下一章`:`第 ${curChap+1} 章已定稿（最后一章）`);
}

  const dirty = raw!==k;

  if(dirty) bits.push(`<span class="pill" style="background:var(--amber-soft);color:var(--amber)">已自动修正隐藏字符</span>`);

  let warn='';
  if(!/^sk-/.test(k))
    warn=`<div class="alert warn" style="margin:7px 0 0;font-size:11.5px;padding:7px 10px">
      这不像 DeepSeek 的 API Key。DeepSeek 的 Key 以 <code>sk-</code> 开头。
      如果你从网页对话版复制的，那是拿不到 Key 的 —— 需要去
      <code>platform.deepseek.com/api_keys</code> 创建。</div>`;
  else if(info.len<20)
    warn=`<div class="alert warn" style="margin:7px 0 0;font-size:11.5px;padding:7px 10px">
      Key 长度只有 ${info.len} 位，疑似复制不完整。DeepSeek 的 Key 约 35 位，请重新完整复制。</div>`;
  else if(info.len>60)
    warn=`<div class="alert warn" style="margin:7px 0 0;font-size:11.5px;padding:7px 10px">
      Key 长度 ${info.len} 位，明显偏长，可能粘进了多余内容。</div>`;
  else
    warn=`<div class="alert ok" style="margin:7px 0 0;font-size:11.5px;padding:7px 10px">
      格式看起来正常。若仍报 401，说明这枚 Key 已失效或不属于当前服务商，请到平台重新生成。</div>`;

  box.innerHTML=`<div class="row" style="gap:5px">${bits.join('')}</div>${warn}`;
}

function download(name,text,mime='text/plain'){
  const b=new Blob([text],{type:mime+';charset=utf-8'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;a.click();

}
function stamp(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
/* 文件名安全化：去掉路径分隔符与非法字符 */
function safeName(){
  const t=(DB.theme.title||'').trim()||'未命名作品';
  return t.replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').slice(0,40);
}
/* ---- 导出纯文本 TXT ----
   针对中文小说阅读器优化：
   · UTF-8 含 BOM —— 否则 Windows 记事本会把 UTF-8 误判为 GBK 而乱码
   · CRLF 换行 —— Windows 与多数手机阅读器的兼容性最好
   · 全角空格缩进两字 —— 中文小说的排版惯例
   段落之间统一为单空行，避免 AI 生成的连续空行造成的松散排版。 */
function buildNovelTxt(opts){
  const o=Object.assign({scope:'all',indent:true,sep:'blank',titlePage:false,head:(DB.theme.title||'')},opts||{});

  let items=DB.chapters.map((c,i)=>({no:i+1,c}));
  if(o.scope==='final')       items=items.filter(x=>x.c.status==='已定稿');
  else if(o.scope==='current')items=items.filter(x=>x.no===curChap+1);
  items=items.filter(x=>(x.c.content||'').trim());   // 跳过无正文的章节

  const out=[];
  const book=(o.head||'').trim()||(DB.theme.title||'').trim()||'未命名作品';

  // 扉页
  if(o.titlePage){
    out.push(book,'');
    const epi=DB.theme.epigraphs.filter(Boolean);
    if(epi.length) out.push('　　'+epi[0]);
    out.push('');
    if(DB.theme.logline) out.push('　　'+DB.theme.logline);
    out.push('','');
  }

  items.forEach((x,idx)=>{
    const title=(x.c.title||'').trim();
    out.push(title?`第${x.no}章　${title}`:`第${x.no}章`);
    out.push('');
    // 规范化正文：统一换行、压缩连续空行
    let body=(x.c.content||'').replace(/\r\n?/g,'\n');
    body=body.split('\n').map(l=>l.replace(/[ \t]+$/,'')).join('\n');
    body=body.replace(/\n{3,}/g,'\n\n').trim();
    if(o.indent){
      body=body.split('\n').map(l=>{
        const t=l.trim();
        if(!t) return '';
        // 已带全角缩进的保持原样，避免重复缩进；其余（含对白行）统一缩进两字
        return /^\u3000/.test(l) ? t : '　　'+t;
      }).join('\n');
    }
    out.push(body);
    if(idx<items.length-1){
      out.push('');
      if(o.sep==='line') out.push('※※※');
      else if(o.sep==='page') out.push('\f');
      out.push('');
    }
  });

  const text=out.join('\n').replace(/\n{4,}/g,'\n\n\n').trim()+'\n';
  const chars=items.reduce((s,x)=>s+countWords(x.c.content||''),0);
  return {text,count:items.length,chars,book};
}

/* TXT 专用下载：加 BOM + CRLF */
function downloadTxt(name,text){
  const withBom='\uFEFF'+text.replace(/\r?\n/g,'\r\n');

  const u=URL.createObjectURL(b),a=document.createElement('a');

}

function toMarkdown(){  const L=[],total=DB.chapters.reduce((s,c)=>s+countWords(c.content||''),0);
  L.push('# '+(DB.theme.title||'未命名作品'),'','> '+(DB.theme.logline||''),'');
  L.push(`*全书 ${DB.chapters.length} 章，累计 ${fmt(total)} 字*`,'');
  if(DB.theme._arch) L.push('## 小说架构','',DB.theme._arch,'');
  L.push('## 一、主题内核','','### 核心命题','');
  DB.theme.proposition.forEach(p=>L.push(`- **${p.layer}**：${p.text}　（情节功能：${p.scene||'—'}）`));
  L.push('','### 主题句候选','');
  DB.theme.epigraphs.filter(Boolean).forEach(e=>L.push(`> ${e}`));
  L.push('');
  if(DB.world.era||DB.world.tech.length||DB.world.rules){
    L.push('## 二、世界观','');
    if(DB.world.era)L.push(DB.world.era,'');
    if(DB.world.tech.length){L.push('### 技术设定','');
      DB.world.tech.forEach(t=>L.push(`- **${t.name}**：${t.desc||''}`));L.push('');}
    if(DB.world.events.length){L.push('### 关键事件','');
      DB.world.events.forEach(e=>L.push(`- ${e.time||''} ${e.text||''}`));L.push('');}
    if(DB.world.rules)L.push('### 世界规则','',DB.world.rules,'');
  }
  L.push('## 三、阵营组织','');
  DB.factions.forEach(f=>{L.push(`### ${f.name}（${f.camp}）`,'',f.claim||'','',
    `- 现实原型：${f.proto||'—'}`);if(f.notes)L.push(`- 设计：${f.notes}`);L.push('');});
  if(DB.characters.length){
    L.push('## 四、人物','');
    DB.characters.forEach(c=>{
      L.push(`### ${c.name||'（未命名）'}`,'');
      L.push(`- 身份：${c.role||'—'}`);L.push(`- 阵营：${c.faction||'—'}`);
      L.push(`- 立场：${c.stand||'—'}`);L.push(`- 动机：${c.motive||'—'}`);
      L.push(`- 秘密：${c.secret||'—'}`);L.push(`- 弧光：${c.arc||'—'}`);L.push('');
    });
  }
  if(DB.scenes.length){
    L.push('## 五、灵感碎片','');
    DB.scenes.forEach(s=>L.push(`- ${s.used?'[已用]':'[待用]'} ${s.tag?`「${s.tag}」`:''} ${s.text||''}`));
    L.push('');
  }
  L.push('## 六、章节大纲','');
  DB.chapters.forEach((c,i)=>{
    L.push(`### 第 ${i+1} 章　${c.title||'（未命名）'}`,'');
    if(c.summary)L.push(c.summary,'');
    L.push(`*状态：${c.status||'待写'}　字数：${fmt(countWords(c.content||''))}*`,'');
  });
  const w=DB.chapters.filter(c=>(c.content||'').trim());
  if(w.length){
    L.push('---','','## 正文','');
    w.forEach(c=>{const no=DB.chapters.indexOf(c)+1;
      L.push(`### 第 ${no} 章　${c.title||''}`,'',c.content.trim(),'');});
  }
  return L.join('\n');
}

/* --- 兜底一：切到后台 / 关闭页面 / 崩溃前，同步落盘 --- */
function emergencyFlush(){
  if(dirty||saveT) saveNow();
}

window.addEventListener('pagehide',emergencyFlush);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) emergencyFlush(); });

});

/* --- 启动自检：存储不可用 / 从备份恢复，都必须让用户知道 --- */
(function bootCheck(){
  if(!STORAGE.ok){
    setSaveState('fail',storageBlockNote());
  }else if(DB._recovered){
    toast('主数据损坏，已从上一版备份恢复');
    log('检测到主存储异常，已自动回退到备份快照');
  }
})();

function render(){
  buildNav();
  document.getElementById('view').innerHTML=(V[route]||V.dash)();
  paintApiState();
  if(route==='model') paintKeyDiag();
  if(route==='write') paintSelInfo();
  // 状态栏：有待写盘内容就显示「待保存」，否则显示上次成功保存的时刻
  if(!STORAGE.ok) setSaveState('fail',storageBlockNote());
  else if(dirty||saveT) setSaveState('pending');
  else if(DB.updated) setSaveState('ok');
  else setSaveState('idle');
  if(route==='dash') paintStorageInfo();
}
render();
</script>
</body>
</html>
