<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI 长篇小说创作台：架构、大纲、正文、改稿、摘要、导出，全部在本机浏览器完成，API Key 只存在你自己的浏览器里。">
<title>AI 小说创作台</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#ffffff; --panel-2:#f4f2ee; --line:#e2ded6;
    --line-strong:#cdc7bc; --ink:#20201e; --ink-2:#5b5953; --ink-3:#8b8880;
    --accent:#534AB7; --accent-soft:#EEEDFE;
    --blue:#185FA5; --blue-soft:#E6F1FB;
    --amber:#BA7517; --amber-soft:#FAEEDA;
    --coral:#D85A30; --coral-soft:#FAECE7;
    --teal:#0F6E56; --teal-soft:#E1F5EE;
    --red:#A32D2D; --red-soft:#FCEBEB;
    --radius:10px; --radius-lg:14px;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Songti SC","SimSun",Georgia,serif;
    --mono:ui-monospace,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  svg{flex:none}
  .app{display:flex;min-height:100vh}

  /* 侧栏 */
  .sidebar{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:0 8px 15px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .brand h1{font-size:16px;font-weight:500;letter-spacing:.5px}
  .brand p{font-size:11px;color:var(--ink-3);margin-top:3px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    cursor:pointer;color:var(--ink-2);font-size:13px;border:none;background:none;text-align:left;width:100%}
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .nav-group{font-size:11px;color:var(--ink-3);padding:13px 10px 5px;letter-spacing:.8px}
  .side-foot{padding:12px 10px 4px;border-top:1px solid var(--line);margin-top:12px;
    font-size:11px;color:var(--ink-3);line-height:1.8}
  .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--line-strong);margin-right:4px}
  .dot.ok{background:var(--teal)} .dot.bad{background:var(--red)}

  /* 主区 */
  .main{flex:1;min-width:0;padding:24px 30px 90px;max-width:1200px}
  .view-head{margin-bottom:18px}
  .view-head h2{font-size:20px;font-weight:500}
  .view-head p{color:var(--ink-2);font-size:13px;margin-top:4px;max-width:78ch}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:13px}
  .card-t{font-size:14px;font-weight:500;margin-bottom:11px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card-t .hint{font-size:11px;color:var(--ink-3);font-weight:400}

  label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;outline:none;line-height:1.7;transition:border-color .12s,box-shadow .12s}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;font-family:inherit}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .field{margin-bottom:12px}.field:last-child{margin-bottom:0}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;font-size:13px;
    transition:background .12s}
  .btn:hover{background:var(--panel-2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:#453CA0}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{color:var(--red);border-color:#e8c4c4}
  .btn.danger:hover{background:var(--red-soft)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:13px 15px}
  .stat .n{font-size:25px;font-weight:500;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--ink-3);margin-top:2px}
  .bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:9px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

  .fac{border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:10px;
    padding:12px 14px;background:var(--panel);margin-bottom:9px}
  .fac .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .fac .nm{font-size:14px;font-weight:500}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .fac .claim{font-size:13px;margin-bottom:5px}
  .fac .proto{font-size:12px;color:var(--ink-3)}
  .f-inherit{border-left-color:var(--accent)}.f-inherit .tag{background:var(--accent-soft);color:var(--accent)}
  .f-witness{border-left-color:var(--blue)}.f-witness .tag{background:var(--blue-soft);color:var(--blue)}
  .f-corp{border-left-color:var(--teal)}.f-corp .tag{background:var(--teal-soft);color:var(--teal)}
  .f-acad{border-left-color:var(--amber)}.f-acad .tag{background:var(--amber-soft);color:var(--amber)}
  .f-debunk{border-left-color:var(--coral)}.f-debunk .tag{background:var(--coral-soft);color:var(--coral)}

  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .item-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .item-h .t{font-size:13px;font-weight:500;color:var(--ink-2)}
  .empty{padding:32px 18px;text-align:center;color:var(--ink-3);font-size:13px;
    border:1px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--panel)}

  .ch{display:grid;grid-template-columns:48px 1fr 118px 88px 32px;gap:8px;align-items:center;
    padding:7px 9px;border-radius:8px}
  .ch:hover{background:var(--panel-2)}
  .ch.head{font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--line);border-radius:0;padding-bottom:8px}
  .ch .no{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .ch input,.ch select{padding:5px 8px;font-size:13px;background:transparent;border-color:transparent}
  .ch input:hover,.ch select:hover{border-color:var(--line)}
  .ch input:focus,.ch select:focus{background:var(--panel)}
  .chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
  .chip.done{background:var(--teal-soft);color:var(--teal)}
  .chip.draft{background:var(--amber-soft);color:var(--amber)}
  .icon-btn{border:none;background:none;cursor:pointer;color:var(--ink-3);padding:4px;border-radius:6px;font-size:16px;line-height:1}
  .icon-btn:hover{background:var(--red-soft);color:var(--red)}

  .mat{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);margin-bottom:8px}
  .mat .ico{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:500}
  .mat.pdf .ico{background:var(--red-soft);color:var(--red)}
  .mat.txt .ico{background:var(--blue-soft);color:var(--blue)}
  .mat .body{flex:1;min-width:0}
  .mat .nm{font-size:13px;font-weight:500;margin-bottom:2px}
  .mat .ds{font-size:12px;color:var(--ink-2);line-height:1.6;margin-bottom:4px}
  .mat .pt{font-size:11px;color:var(--ink-3);font-family:var(--mono);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .mat .act{display:flex;gap:6px;flex:none}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
    background:var(--panel-2);color:var(--ink-2);margin-right:5px}
  .tabs{display:flex;gap:4px;margin-bottom:13px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--ink-2);
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

  /* 题材筛选 */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .chip{font:inherit;font-size:12px;padding:4px 11px;border:1px solid var(--line);
    background:var(--panel);border-radius:99px;cursor:pointer;color:var(--ink-2);transition:.15s}
  .chip:hover{border-color:var(--line-strong);color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .num{opacity:.6;font-size:10.5px;margin-left:3px}
  .chip.on .num{opacity:.8}
  .chip .you{opacity:.85;font-size:10px;margin-left:2px}
  .libcount{font-size:11.5px;color:var(--ink-3);margin-bottom:9px}

  /* 写作区 */
  .ms{width:100%;min-height:56vh;border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:24px 28px;font-family:var(--serif);font-size:16px;line-height:2;background:var(--panel);resize:vertical}
  .ms:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ai-out{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);
    padding:20px 24px;font-family:var(--serif);font-size:15px;line-height:2;white-space:pre-wrap;
    max-height:52vh;overflow-y:auto;margin-top:12px}
  .ai-out:empty{display:none}
  .ai-meta{font-size:11px;color:var(--ink-3);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--accent);
    border-top-color:transparent;border-radius:99px;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .logbox{font-family:var(--mono);font-size:11.5px;line-height:1.75;background:var(--panel-2);
    border-radius:8px;padding:10px 12px;max-height:150px;overflow-y:auto;color:var(--ink-2);white-space:pre-wrap}
  .logbox:empty{display:none}
  .alert{padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.7;margin-bottom:12px}
  .alert.warn{background:var(--amber-soft);color:#7a4f0a;border:1px solid #eed9a8}
  .alert.err{background:var(--red-soft);color:var(--red);border:1px solid #eec4c4}
  .alert.ok{background:var(--teal-soft);color:var(--teal);border:1px solid #9fd8c4}
  .alert code{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}

  .toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:9px 16px;
    border-radius:9px;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:99}
  .toast.on{opacity:1;transform:none}
  .sv{font-size:9px;vertical-align:1.5px;color:var(--ink-3);margin-right:3px}
  .sv.ok{color:var(--teal)} .sv.wait{color:var(--amber)} .sv.bad{color:var(--red)}
  .banner{position:fixed;top:0;left:0;right:0;z-index:120;background:var(--red-soft);
    color:var(--red);border-bottom:1px solid #efc7c7;padding:9px 18px;font-size:12.5px;
    line-height:1.65}
  .banner b{font-weight:600}
  .savenote{font-size:11.5px;color:var(--ink-3);line-height:1.85;margin-top:9px}
  .savenote code{font-family:var(--mono);font-size:11px;background:var(--panel-2);
    padding:1px 5px;border-radius:5px;color:var(--ink-2)}
  .quote{border-left:3px solid var(--line-strong);padding:2px 0 2px 14px;color:var(--ink-2);
    font-family:var(--serif);font-size:14px;line-height:1.9;margin:8px 0}

  /* 修订标记：红色=删去，绿色=增添 */
  .diff-del{background:#FCEBEB;color:#A32D2D;text-decoration:line-through;
    text-decoration-color:#E24B4A;border-radius:2px}
  .diff-ins{background:#EAF3DE;color:#3B6D11;text-decoration:underline;
    text-decoration-color:#639922;border-radius:2px}
  .diff-legend{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3)}
  .diff-legend i{font-style:normal;padding:1px 7px;border-radius:4px}
  .diff-legend i.d{background:#FCEBEB;color:#A32D2D;text-decoration:line-through}
  .diff-legend i.a{background:#EAF3DE;color:#3B6D11;text-decoration:underline}
  .c-del{color:#A32D2D;font-weight:500}
  .c-ins{color:#3B6D11;font-weight:500}

  @media(max-width:940px){
    .sidebar{width:62px;padding:14px 8px}
    .brand h1,.brand p,.nav-item span,.nav-group,.side-foot{display:none}
    .nav-item{justify-content:center;padding:10px}
    .main{padding:16px 13px 60px}
    .stats,.grid4{grid-template-columns:1fr 1fr}
    .grid2,.grid3{grid-template-columns:1fr}
    .ch{grid-template-columns:34px 1fr 84px 32px}
  }
</style>
</head>
<body>
<div class="banner" id="saveBanner" hidden></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>AI 小说创作台</h1><p>长篇小说工作台</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span id="apiState"><span class="dot"></span>未配置模型</span><br>
      <span id="savedAt">尚未修改</span>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   1. 数据层
   ================================================================== */
const KEY='ai_novel_studio_v1';
const OLD_KEYS=['ershou_taiyang_ai_v2','ershou_taiyang_ai_v2__prev'];  // 早期版本（本工作台前身）的数据槽，可一键导入
const KEY_BAK='ai_novel_studio_v1__prev';      // 上一版快照：写入失败或误操作时可回滚
const KEY_PROBE='ai_novel_studio_v1__probe';   // 存储可用性探针

/* ---------- 存储可用性自检 ----------
   直接双击本文件（file:// ）打开时一般可用；
   若被塞进沙箱化的内嵌预览窗口，localStorage 会被拒绝访问。
   先探一次，避免「以为在存、其实全丢」。 */
const STORAGE=(()=>{
  const isFile=(typeof location!=='undefined' && location.protocol==='file:');
  try{
    localStorage.setItem(KEY_PROBE,'1');
    localStorage.removeItem(KEY_PROBE);
    // 再确认真的可读回（某些隐私模式会静默吞掉写入）
    if(localStorage.getItem(KEY_PROBE)!==null) throw new Error('写入未生效');
    return {ok:true,reason:'',isFile};
  }catch(e){
    const denied=/security|denied|disabled|blocked|insecure/i.test((e.name||'')+' '+(e.message||''));
    if(!denied){
      return {ok:false,isFile,reason:'本地存储不可用：'+(e.message||e.name||'未知原因')};
    }
    return {ok:false,isFile,reason: isFile
      ? '当前环境禁止网页使用本地存储 —— 通常是因为在内嵌预览窗口里打开了本文件。'
      : '浏览器禁止了本站使用本地存储 —— 可能处于隐私/无痕模式，或屏蔽了站点数据。'};
  }
})();

const DEFAULT={
  theme:{
    title:'',            // 作品名
    genre:'',            // 类型：科幻 / 悬疑 / 言情 / 奇幻 / 历史 …
    tone:'',             // 基调：冷峻 / 温暖 / 荒诞 / 史诗 …
    audience:'',         // 目标读者（可选）
    logline:'',
    proposition:[
      {layer:'表层',text:'',scene:''},
      {layer:'中层',text:'',scene:''},
      {layer:'深层',text:'',scene:''}
    ],
    epigraphs:['','','',''],
    pitch:''
  },
  world:{
    era:'',tech:[],events:[],rules:''
  },
  factions:[
    {key:'f1',camp:'',name:'',claim:'',proto:'',notes:''},
    {key:'f2',camp:'',name:'',claim:'',proto:'',notes:''},
    {key:'f3',camp:'',name:'',claim:'',proto:'',notes:''}
  ],
  characters:[
    {name:'',role:'',faction:'',stand:'',motive:'',secret:'',arc:''},
    {name:'',role:'',faction:'',stand:'',motive:'',secret:'',arc:''},
    {name:'',role:'',faction:'',stand:'',motive:'',secret:'',arc:''}
  ],
  chapters:[],
  scenes:[],
  refs:[],               // 用户自己的参考资料
  goal:100000,
  logs:[],
  exportOpt:{scope:'all',indent:true,sep:'blank',titlePage:false,head:''},
  revDiffMode:'mark',
  ui:{route:'dash',curChap:0},
  pending:{draft:'',outline:'',sparks:''},
  updated:''
};

/* 前文摘要配置
   架构说明：不再维护「一坨整体摘要」，而是每章各存一份摘要（chapter.sum），
   整体摘要由 buildSummaryText() 按序拼装。这样永远不会漂移、可追溯到章、
   重写某章只影响那一章。 */
const DEFAULT_SUM={
  mode:'auto',        // auto=自动汇总各章摘要 | manual=手动整段
  manual:'',          // 手动模式下的整段摘要
  maxChars:2000,      // 自动汇总的字数上限，超出则压缩早期章节
  recentChapters:6,   // 超出上限时，保留最近 N 章为完整摘要
  includeUnfinal:true // 是否纳入未定稿（草稿）章节
};

/* ---------- AI 配置（参照 AI_NovelGenerator 的多预设 + 任务路由） ---------- */
const PRESETS={
  'DeepSeek V4 Flash':{base_url:'https://api.deepseek.com',interface_format:'DeepSeek',model_name:'deepseek-v4-flash',temperature:0.7,max_tokens:8192,timeout:600,thinking_mode:'disabled'},
  'DeepSeek V4 Pro':  {base_url:'https://api.deepseek.com',interface_format:'DeepSeek',model_name:'deepseek-v4-pro',temperature:0.7,max_tokens:32768,timeout:600,thinking_mode:'disabled'},
  '硅基流动':{base_url:'https://api.siliconflow.cn/v1',interface_format:'SiliconFlow',model_name:'deepseek-ai/DeepSeek-V3',temperature:0.7,max_tokens:8192,timeout:600,thinking_mode:'default'},
  'OpenAI 兼容':{base_url:'https://api.openai.com/v1',interface_format:'OpenAI',model_name:'gpt-4o',temperature:0.7,max_tokens:8192,timeout:600,thinking_mode:'default'},
  'Ollama 本地':{base_url:'http://localhost:11434/v1',interface_format:'Ollama',model_name:'qwen2.5:14b',temperature:0.7,max_tokens:4096,timeout:600,thinking_mode:'default'},
  '自定义':{base_url:'',interface_format:'OpenAI',model_name:'',temperature:0.7,max_tokens:8192,timeout:600,thinking_mode:'default'}
};
const TASKS=[
  {k:'architecture_llm', n:'架构生成', d:'生成小说总架构（世界观/角色/情节）'},
  {k:'outline_llm',      n:'大纲生成', d:'生成章节节奏分布'},
  {k:'draft_llm',        n:'草稿生成', d:'生成本章正文'},
  {k:'expand_llm',       n:'扩写润色', d:'把偏短的章节扩写到目标字数'},
  {k:'summary_llm',      n:'摘要维护', d:'更新前文摘要与角色状态'},
  {k:'review_llm',       n:'一致性审校',d:'检查与设定的冲突'}
];

const DEFAULT_AI={
  configs:{
    'DeepSeek V4 Flash':Object.assign({api_key:''},PRESETS['DeepSeek V4 Flash']),
    'DeepSeek V4 Pro':  Object.assign({api_key:''},PRESETS['DeepSeek V4 Pro'])
  },
  last_config:'DeepSeek V4 Flash',
  choose:{architecture_llm:'DeepSeek V4 Pro',outline_llm:'DeepSeek V4 Pro',
          draft_llm:'DeepSeek V4 Pro',expand_llm:'DeepSeek V4 Flash',
          summary_llm:'DeepSeek V4 Flash',review_llm:'DeepSeek V4 Flash'},
  streaming:true,
  guideAuto:true,   // 生成/改稿时自动从写作参考库提取相关条目
  guideTop:3        // 每次最多注入几条
};

let DB=load();
function mergeDefaults(over){
  const o=Object.assign(structuredClone(DEFAULT),over||{});
  o.ai=Object.assign(structuredClone(DEFAULT_AI),o.ai||{});
  o.summaryCfg=Object.assign(structuredClone(DEFAULT_SUM),o.summaryCfg||{});
  o.ui=Object.assign(structuredClone(DEFAULT.ui),o.ui||{});
  o.pending=Object.assign(structuredClone(DEFAULT.pending),o.pending||{});
  o.exportOpt=Object.assign(structuredClone(DEFAULT.exportOpt),o.exportOpt||{});
  if(!Array.isArray(o.chapters)) o.chapters=[];
  if(!Array.isArray(o.logs)) o.logs=[];
  if(!Array.isArray(o.characters)) o.characters=[];
  if(!Array.isArray(o.factions)) o.factions=[];
  if(!Array.isArray(o.scenes)) o.scenes=[];
  return o;
}
/* 读主存储；主存储损坏或缺失时退回上一版快照 */
function load(){
  for(const k of [KEY,KEY_BAK]){
    try{
      const raw=localStorage.getItem(k);
      if(!raw) continue;
      const d=JSON.parse(raw);
      if(!d||typeof d!=='object'||Array.isArray(d)) continue;
      const o=mergeDefaults(d);
      // 迁移旧的单一摘要：老版本把整段摘要存在 theme._summary
      if(!d.summaryCfg && d.theme && (d.theme._summary||'').trim()){
        o.summaryCfg.mode='manual';
        o.summaryCfg.manual=d.theme._summary;
      }
      if(k===KEY_BAK) o._recovered=true;
      return o;
    }catch(e){ /* 该键损坏 → 试下一个 */ }
  }
  return mergeDefaults(null);
}
/* 页面开始写盘前的兜底：任何一次改动都先标记，再由统一出口落盘 */
let saveT=null, dirty=false, saving=false, lastOkAt=0;

/* 存储不可用时的完整提示：原因 + 后果 + 处置办法 */
function storageBlockNote(){
  const fix = STORAGE.isFile
    ? '请用浏览器直接打开本文件（双击），不要在内嵌预览窗口里使用。'
    : '请关闭无痕模式，或在浏览器设置中允许本站保存数据。';
  return STORAGE.reason+' 你的修改不会被保留。'+fix;
}

function setSaveState(state,note){
  const el=document.getElementById('savedAt');
  if(el){
    if(state==='ok'){
      const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      el.innerHTML=`<span class="sv ok">●</span>已保存 ${t}`;
    }else if(state==='pending'){
      el.innerHTML=`<span class="sv wait">●</span>待保存…`;
    }else if(state==='fail'){
      el.innerHTML=`<span class="sv bad">●</span>${note?'保存失败':'未保存'}`;
    }else{
      el.innerHTML=`<span class="sv">●</span>尚未修改`;
    }
  }
  const b=document.getElementById('saveBanner');
  if(b){
    if(state==='fail'&&note){ b.hidden=false; b.innerHTML=`<b>⚠ 保存失败</b>　${esc(note)}`; }
    else if(state!=='fail'){ b.hidden=true; }
  }
}

function sizeOf(){
  try{ return (localStorage.getItem(KEY)||'').length+(localStorage.getItem(KEY_BAK)||'').length; }
  catch(e){ return 0; }
}

/* 真正的一次写盘。先把上一版留档，再覆盖主存储。
   注意：比较时剔掉 updated 时间戳，否则每次都会「看起来变了」而反复轮转备份，
   把真正值得回滚的那一版挤掉。 */
let lastFp=null;
/* 以「上次落盘的内容指纹」为基线：下次保存只有在内容真的变了时才轮转备份 */
try{
  const stored=localStorage.getItem(KEY);
  if(stored) lastFp=stored.replace(/"updated":"[^"]*"/,'');
}catch(e){}
function persistNow(){
  const json=JSON.stringify(DB);
  const fp=json.replace(/"updated":"[^"]*"/,'');
  try{
    const cur=localStorage.getItem(KEY);
    // 仅当内容确有变化时，才把上一版移入备份槽
    if(cur && lastFp!==null && fp!==lastFp) localStorage.setItem(KEY_BAK,cur);
  }catch(e){ try{ localStorage.removeItem(KEY_BAK); }catch(e2){} }
  localStorage.setItem(KEY,json);
  lastFp=fp;
  return json.length;
}

/* 配额不足时的瘦身手段，按「损失最小」排序，返回是否还有可腾挪的 */
function slimOnce(step){
  if(step===0){                                  // 1) 备份快照只占空间，先丢
    try{ localStorage.removeItem(KEY_BAK); }catch(e){}
    return true;
  }
  if(step===1 && (DB.logs||[]).length>40){       // 2) 截断运行日志
    DB.logs=DB.logs.slice(-40);
    return true;
  }
  if(step===2){                                  // 3) 清掉尚未落盘的预览草稿
    const p=DB.pending||{};
    if(p.draft||p.outline||p.sparks){
      DB.pending={draft:'',outline:'',sparks:''};
      return true;
    }
  }
  return false;
}

/* 立即落盘，返回是否成功 */
function saveNow(){
  clearTimeout(saveT); saveT=null;
  if(saving) return true;
  if(!STORAGE.ok){ setSaveState('fail',storageBlockNote()); return false; }
  saving=true;
  DB.updated=new Date().toISOString();
  const done=(ok,note)=>{
    saving=false;
    if(ok){ dirty=false; lastOkAt=Date.now(); setSaveState('ok'); }
    else  { setSaveState('fail',note); }
    paintStorageInfo();
    return ok;
  };
  try{
    persistNow();
    return done(true);
  }catch(err){
    const quota=/quota|exceed|full/i.test((err.name||'')+' '+String(err.message||''));
    if(quota){
      for(let s=0;s<3;s++){
        try{
          if(!slimOnce(s)) break;
          persistNow();
          return done(true);
        }catch(e){ /* 继续下一档瘦身 */ }
      }
    }
    return done(false, quota
      ? '浏览器本地存储已满。请先在仪表盘点「导出备份 (JSON)」，再清理浏览器数据或删掉旧项目，然后重试。'
      : (err.message||String(err)));
  }
}

/* 日常入口：防抖 400ms（数据已在内存中最新的 DB 里，此处只延后写盘） */
function save(){
  dirty=true;
  setSaveState('pending');
  clearTimeout(saveT);
  saveT=setTimeout(()=>saveNow(),400);
}

/* 需要确定已落盘的时刻（切章、关页等）调用 */
function flushSave(){
  if(saveT||dirty) return saveNow();
  return true;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function countWords(t){

       +(t.match(/[a-zA-Z]+/g)||[]).length
       +(t.match(/\d+/g)||[]).length;
}
function fmt(n){return (n||0).toLocaleString('zh-CN');}
function uid(){return Math.random().toString(36).slice(2,9);}

function setPath(o,p,v){

  for(let i=0;i<ks.length-1;i++){const k=/^\d+$/.test(ks[i])?+ks[i]:ks[i];c=c[k];}

}

/* ==================================================================
   2. AI 调用引擎（参照 llm_adapters.py 的适配器模式）
   ================================================================== */
function activeCfg(taskKey){

/* 清洗 API Key：去掉粘贴时常见的不可见字符与多余前缀
   常见污染源：换行、首尾空格、零宽字符（U+200B~200D / U+FEFF）、
   中文全角空格、被连带的 "Bearer " 前缀、成对引号 */
function sanitizeKey(raw){
  if(raw==null) return '';
  let k=String(raw);
  // 1) 先清除不可见字符与空白
  k=k.replace(/[\u200B-\u200D\uFEFF\u00A0\u3000]/g,'');      // 零宽/不可见空白
  k=k.replace(/[\r\n\t]+/g,'');                                // 换行制表
  k=k.trim();
  // 2) 循环剥离「Bearer 前缀 + 成对引号」，两种污染可能嵌套出现
  for(let i=0;i<4;i++){
    const before=k;
    k=k.replace(/^Bearer\s+/i,'').trim();                      // 误带协议前缀
    k=k.replace(/^["'`]+|["'`]+$/g,'').trim();                 // 被粘贴进来的引号
    if(k===before) break;
  }
  return k.trim();
}
/* Key 诊断：只暴露首尾片段，用于人工核对（不泄露完整 Key） */
function keyInfo(k){
  k=sanitizeKey(k);
  if(!k) return {ok:false,msg:'未填写'};
  const len=k.length;
  const head=k.slice(0,6), tail=k.slice(-4);
  const mask=len>12 ? `${head}…${tail}` : `${head}…`;
  const issues=[];
  if(k!==String(k).trim()) issues.push('含首尾空白');
  if(!/^sk-/.test(k)) issues.push('不以 sk- 开头');
  if(len<20) issues.push('长度偏短，可能没复制完整');
  if(/\s/.test(k)) issues.push('含空白字符');
  return {ok:true,mask,len,issues};
}

function apiState(){

    return isLocal || sanitizeKey(c.api_key);

}

  const s=apiState();

}
function needKeyLabel(fmt){

}

/* ---- 构造请求，适配不同厂商 ---- */
function buildRequest(cfg,prompt,systemPrompt,streamOverride){
  const fmt=(cfg.interface_format||'OpenAI').toLowerCase();
  const base=(cfg.base_url||'').replace(/\/+$/,'');
  const useStream = (streamOverride===undefined) ? !!DB.ai.streaming : !!streamOverride;
  const messages=[];
  if(systemPrompt) messages.push({role:'system',content:systemPrompt});
  messages.push({role:'user',content:prompt});

  // Gemini 使用独立协议（流式与非流式端点不同）
  if(fmt==='gemini'){
    const key=sanitizeKey(cfg.api_key);
    const ep = useStream ? 'streamGenerateContent?alt=sse&' : 'generateContent?';
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model_name)}:${ep}key=${encodeURIComponent(key)}`;
    const body={contents:[{parts:[{text:(systemPrompt?systemPrompt+'\n\n':'')+prompt}]}],
      generationConfig:{temperature:Number(cfg.temperature)||0.7,maxOutputTokens:Number(cfg.max_tokens)||8192}};
    return {url,headers:{'Content-Type':'application/json'},body,stream:useStream};
  }

  // 其余走 OpenAI 兼容协议
  let url;
  if(/\/chat\/completions$/.test(base)) url=base;
  else url=base+'/chat/completions';
  const headers={'Content-Type':'application/json'};
  const isLocal=/ollama/i.test(fmt);
  if(!isLocal) headers['Authorization']='Bearer '+sanitizeKey(cfg.api_key);
  else headers['Authorization']='Bearer ollama';

  const body={
    model:cfg.model_name,
    messages,
    temperature:Number(cfg.temperature)||0.7,
    max_tokens:Number(cfg.max_tokens)||8192,
    stream:useStream
  };
  // DeepSeek 思考模式控制。
  // 官方默认「开启且强度 high」，思维链会经 reasoning_content 返回，
  // 写小说时 token 常被思维链吃光，导致 content 为空 —— 表现为"返回内容为空"。
  // 因此 DeepSeek 格式默认显式关闭；其他厂商不传，避免严格 API 拒绝未知字段。
  const tm = cfg.thinking_mode || (fmt==='deepseek' ? 'disabled' : 'default');
  if(tm==='disabled')      body.thinking={type:'disabled'};
  else if(tm==='enabled')  body.thinking={type:'enabled'};
  // tm==='default' 时不传该字段，沿用服务端默认行为

  return {url,headers,body,stream:useStream};
}

/* ---- 解析流式分片 ----
   重要：DeepSeek V4 / 推理模型在思考模式下，正文以外的思维链
   放在 delta.reasoning_content 里，而正文仍在 delta.content。
   若模型把 token 全用于思考（或 max_tokens 偏小），
   content 会一直是空串——必须单独收集，否则会误判为"返回为空"。 */
function parseChunk(raw){
  const out=[];
  for(const line of raw.split('\n')){
    const s=line.trim();
    if(!s||s.startsWith(':'))continue;              // SSE 注释/心跳
    if(!s.startsWith('data:'))continue;
    const d=s.slice(5).trim();
    if(d==='[DONE]'){out.push({done:true});continue;}
    try{
      const j=JSON.parse(d);
      if(j.error){out.push({error:j.error.message||JSON.stringify(j.error)});continue;}
      // OpenAI 兼容（含 DeepSeek）
      const c=j.choices&&j.choices[0];
      if(c){
        const dl=c.delta||c.message||{};
        if(dl.reasoning_content) out.push({reasoning:dl.reasoning_content});  // 思考过程
        if(dl.content)           out.push({text:dl.content});                 // 正文
        if(c.finish_reason)      out.push({finish:c.finish_reason});
      }
      // Gemini
      const g=j.candidates&&j.candidates[0];
      if(g){
        const ps=(g.content&&g.content.parts)||[];
        for(const p of ps){
          if(p.thought) out.push({reasoning:p.text||''});
          else if(p.text) out.push({text:p.text});
        }
        if(g.finishReason) out.push({finish:g.finishReason});
      }
    }catch(e){/* 忽略不完整分片 */}
  }
  return out;
}

/* ---- 单次调用（内部） ---- */
async function _callOnce({taskKey,prompt,systemPrompt,onDelta,onReason,signal,streamOverride}){
  const a=activeCfg(taskKey);
  if(!a) throw new Error('未找到该任务的模型配置，请到「模型配置」检查。');
  const cfg=a.cfg;
  const fmt=(cfg.interface_format||'').toLowerCase();
  const isLocal=/ollama/i.test(fmt);
  const key=sanitizeKey(cfg.api_key);
  if(!isLocal && !key){
    throw new Error(`配置「${a.name}」的 API Key 为空。请到「模型配置」填写并保存。`);
  }
  if(!cfg.model_name||!cfg.model_name.trim())
    throw new Error(`配置「${a.name}」的模型名称为空。`);

  const req=buildRequest(cfg,prompt,systemPrompt,streamOverride);
  const {url,headers,body,stream}=req;
  // 日志中只记录 Key 指纹，避免完整 Key 落入日志
  const ki=keyInfo(cfg.api_key);
  log(`→ ${a.name} / ${cfg.model_name} / ${stream?'流式':'非流式'} / Key ${ki.ok?ki.mask+`(len=${ki.len})`:'空'} / 提示词 ${prompt.length} 字`);

  const ctl=new AbortController();
  if(signal) signal.onabort=()=>ctl.abort();

  let res;
  try{
    res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal});
  }catch(err){
    if(err.name==='AbortError') throw err;
    throw new Error(`网络请求失败（${err.message}）。请检查 Base URL 是否正确、网络是否可达；若使用 OpenAI 官方接口，其跨域支持不稳定，建议改用 DeepSeek。`);
  }

  if(!res.ok){
    let detail='';
    try{const j=await res.json();detail=j.error?.message||j.error?.code||j.message||JSON.stringify(j);}
    catch(e){try{detail=await res.text();}catch(e2){}}
    const d=String(detail).slice(0,300);
    if(res.status===401){
      const head=a.name;
      const kd=sanitizeKey(cfg.api_key);
      throw new Error(
        `HTTP 401 · 鉴权失败\n\n`+
        `DeepSeek 拒绝了这枚 Key${kd?`（当前 Key：${kd.slice(0,6)}…${kd.slice(-4)}，长度 ${kd.length}）`:'（当前为空）'}。\n\n`+
        `请逐项核对：\n`+
        `1. Key 是否来自 API 平台 —— 必须去 platform.deepseek.com/api_keys 创建，\n`+
        `   网页对话版（chat.deepseek.com）拿不到 API Key。\n`+
        `2. 是否复制完整 —— DeepSeek 的 Key 以 sk- 开头，长度约 35 位。\n`+
        `3. 是否复制到了别的平台的 Key —— 硅基流动等也以 sk- 开头，容易混淆。\n`+
        `4. 该 Key 是否已被删除或重置。\n\n`+
        `平台原始返回：${d}`
      );
    }
    if(res.status===402) throw new Error(`HTTP 402 · 账户余额不足，请到服务商平台充值。\n\n平台返回：${d}`);
    if(res.status===429) throw new Error(`HTTP 429 · 请求过于频繁或超出并发限制，请稍后重试。\n\n平台返回：${d}`);
    throw new Error(`HTTP ${res.status}　${d}`);
  }

  // 非流式
  if(!stream){
    const raw=await res.text();
    let j;
    try{ j=JSON.parse(raw); }
    catch(e){ throw new Error(`服务端返回的不是合法 JSON，无法解析。\n\n原始响应片段：\n${raw.slice(0,400)}`); }
    if(j.error) throw new Error('服务端返回错误：'+(j.error.message||JSON.stringify(j.error).slice(0,300)));

    let text='',reason='',finish='';
    const c=j.choices&&j.choices[0];
    if(c){
      const m=c.message||{};
      text=m.content||'';                    // 正文
      reason=m.reasoning_content||'';        // DeepSeek 思考过程
      finish=c.finish_reason||'';
    }else{
      const g=j.candidates&&j.candidates[0];
      if(g){
        for(const p of ((g.content&&g.content.parts)||[])){
          if(p.thought) reason+=(p.text||''); else text+=(p.text||'');
        }
        finish=g.finishReason||'';
      }
    }
    if(onDelta&&text) onDelta(text);
    return {text,reasoning:reason,finish,raw:raw.slice(0,600)};
  }

  // 流式
  if(!res.body) throw new Error('当前浏览器不支持流式读取。请到「模型配置」把「流式输出」改为「关闭」后重试。');
  const reader=res.body.getReader();
  const dec=new TextDecoder('utf-8');
  let buf='',full='',reason='',finish='',rawAcc='';
  const consume=(chunkText)=>{
    rawAcc=(rawAcc+chunkText).slice(-1500);
    for(const ev of parseChunk(chunkText)){
      if(ev.error) throw new Error('服务端返回错误：'+ev.error);
      if(ev.text){full+=ev.text;if(onDelta)onDelta(ev.text);}
      if(ev.reasoning){reason+=ev.reasoning;if(onReason)onReason(reason);}
      if(ev.finish)finish=ev.finish;
    }
  };
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    const chunkText=dec.decode(value,{stream:true});
    buf+=chunkText;
    const parts=buf.split('\n');
    buf=parts.pop();
    consume(parts.join('\n'));
  }
  if(buf.trim()) consume(buf);
  return {text:full,reasoning:reason,finish,raw:rawAcc};
}

/* ---- 对外主调用：带自动回退与精准诊断 ---- */
async function callAI(opts){
  const wantStream=!!DB.ai.streaming;
  let r;
  try{
    r=await _callOnce(opts);
  }catch(err){
    // 流式读取失败时，自动改用非流式重试一次
    if(wantStream && opts.streamOverride===undefined && !/HTTP (401|402|429)/.test(err.message)){
      log('流式调用失败，自动改用非流式重试… '+err.message.split('\n')[0]);
      return (await _callOnce(Object.assign({},opts,{streamOverride:false}))).text||'';
    }
    throw err;
  }
  if((r.text||'').trim()) return r.text;

  // 流式没拿到正文 → 自动用非流式重试一次（很多兼容性问题这样能绕过）
  if(wantStream && opts.streamOverride===undefined){
    log('流式未取到正文，自动改用非流式重试…');
    try{
      const r2=await _callOnce(Object.assign({},opts,{streamOverride:false}));
      if((r2.text||'').trim()){ toast('已自动回退到非流式，生成成功'); return r2.text; }
      r=r2;
    }catch(e2){ /* 保留首次结果用于诊断 */ }
  }

  // —— 只拿到思考过程（DeepSeek 思考模式的典型症状）——
  const reason=r.reasoning||'', finish=r.finish||'';
  if(reason.trim()){
    throw new Error(
      `模型只返回了「思考过程」，没有返回正文。\n\n`+
      `思考内容 ${reason.length} 字，正文 0 字，结束原因：${finish||'未知'}\n\n`+
      `这是 DeepSeek 思考模式的典型症状 —— 官方默认「开启且强度为 high」，\n`+
      `模型把 token 大量花在思维链上，正文就没剩多少了。\n\n`+
      `解决办法（按推荐顺序）：\n`+
      `1. 到「模型配置」把「思考模式」设为「关闭」，保存后重试。\n`+
      `   写小说不需要长思维链，这才是根因。\n`+
      `2. 若仍失败，把 max_tokens 调大（如 16384），给正文留足空间。\n`+
      `3. 换用 deepseek-v4-flash（比 v4-pro 更容易关掉思考）。\n\n`+
      `思考过程开头：\n${reason.trim().slice(0,180)}…`
    );
  }

  throw new Error(
    `模型返回内容为空。\n\n`+
    `HTTP 状态正常，但响应里没有任何文本。结束原因：${finish||'未知'}\n\n`+
    (finish==='content_filter'?`· 触发了服务商的内容安全策略（finish_reason = content_filter）。\n  请调整提示词中可能触发拦截的表述后重试。\n`:``)+
    (finish==='length'?`· 达到 token 上限被截断（finish_reason = length）。请调大 max_tokens。\n`:``)+
    (finish==='stop'||finish===''?`· 服务商返回了空响应，常见于模型名写错。\n  请到「模型配置」核对模型名称是否与服务商文档一致。\n`:`· 结束原因异常，请核对模型名与接口格式。\n`)+
    `· 该模型可能不支持当前调用方式。\n  到「模型配置」把「流式输出」改为「关闭」后重试。\n\n`+
    (r.raw?`原始响应片段：\n${r.raw.slice(-600)}`:'（未捕获到原始响应内容）')
  );
}

async function testCfg(name){
  const cfg=DB.ai.configs[name];
  if(!cfg) throw new Error('配置不存在');
  const fmt=(cfg.interface_format||'').toLowerCase();
  if(!/ollama/i.test(fmt) && !sanitizeKey(cfg.api_key))
    throw new Error('API Key 为空');
  const old=DB.ai.choose.__t;DB.ai.choose.__t=name;
  const t0=Date.now();
  try{
    const r=await callAI({taskKey:'__t',prompt:'请只回复两个字：可用'});
    return {ms:Date.now()-t0,text:r.trim().slice(0,40)};
  }finally{
    if(old===undefined) delete DB.ai.choose.__t; else DB.ai.choose.__t=old;
  }
}

/* ==================================================================
   3. 提示词库（改编自 AI_NovelGenerator 的 prompt_definitions.py）
   ================================================================== */
function novelSetting(){
  const T=DB.theme,W=DB.world;
  const L=[];
  const has=(s)=>String(s||'').trim().length>0;

  L.push('# 一、作品基本信息');
  L.push('作品名：'+(has(T.title)?T.title:'（未命名）'));
  if(has(T.genre))    L.push('类型：'+T.genre);
  if(has(T.tone))     L.push('基调：'+T.tone);
  if(has(T.audience)) L.push('目标读者：'+T.audience);
  L.push('');

  L.push('# 二、主题内核');
  L.push('一句话主题：'+(has(T.logline)?T.logline:'（未填写）'));
  const props=(T.proposition||[]).filter(p=>has(p.text));
  if(props.length){
    L.push('命题分层：');
    props.forEach(p=>L.push(`  【${p.layer}】${p.text}${has(p.scene)?`（情节功能：${p.scene}）`:''}`));
  }
  const eps=(T.epigraphs||[]).filter(has);
  if(eps.length){
    L.push('主题句候选：');
    eps.forEach(e=>L.push('  - '+e));
  }
  L.push('');

  L.push('# 三、世界观');
  if(has(W.era)) L.push('时代背景：'+W.era);
  if(has(W.rules)) L.push('世界规则：\n'+W.rules);
  if((W.tech||[]).length){
    L.push('技术／体系设定：');
    W.tech.forEach(t=>L.push(`  - ${t.name}：${t.desc||''}`));
  }
  if((W.events||[]).length){
    L.push('关键事件：');
    W.events.forEach(e=>L.push(`  - ${e.time||''} ${e.text||''}`));
  }
  L.push('');

  const facs=(DB.factions||[]).filter(f=>has(f.name));
  if(facs.length){
    L.push('# 四、阵营／势力');
    facs.forEach(f=>{
      L.push(`【${f.name}】${has(f.camp)?`（${f.camp}）`:''}`);
      if(has(f.claim)) L.push('  主张：'+f.claim);
      if(has(f.notes)) L.push('  在故事中：'+f.notes);
    });
    L.push('');
  }

  const chars=(DB.characters||[]).filter(c=>has(c.name));
  if(chars.length){
    L.push('# 五、人物');
    chars.forEach(c=>{
      L.push(`【${c.name}】${c.role||''}${has(c.faction)?`｜${c.faction}`:''}`);
      if(has(c.stand))  L.push('  立场：'+c.stand);
      if(has(c.motive)) L.push('  动机：'+c.motive);
      if(has(c.secret)) L.push('  秘密：'+c.secret);
      if(has(c.arc))    L.push('  弧光：'+c.arc);
    });
  }

  if(!has(T.title)&&!has(T.logline)&&!has(W.era)&&!has(W.rules)&&!facs.length&&!chars.length){
    L.push('（以上设定大多为空。请依据最基础的创作直觉补全它们，并在开头用一句话说明你补全了什么。不要反问，直接给出方案。）');
  }
  return L.join('\n');
}

同时处理好前后衔接，使删改后的文字读起来是连贯的、看不出缺口。输出删改后的完整正文。`,
      polish:
`【工作模式：润色改写】
下面给出的是本章完整正文。请在**不改变任何情节事实、不增删事件**的前提下，
只打磨语言：句子的节奏、感官细节、对话的潜台词、段落的呼吸感。
输出润色后的完整正文。`
    }[mode] || '';

    const L=[];
    L.push(`你是一位经验丰富的文学编辑，正在协助修改${workLabel()}（${genreLabel()}）的第 ${chapterNo} 章。`);
    L.push('');
    L.push('【小说设定（供你把握人物与设定，不要写进正文）】');
    L.push(novelSetting());
    L.push('');
    const ch=DB.chapters[chapterNo-1]||{};
    if(ch.title||ch.summary){
      L.push('【本章大纲】');
      if(ch.title) L.push('标题：'+ch.title);
      if(ch.summary) L.push('简述：'+ch.summary);
      L.push('');
    }
    L.push('【本次修改要求】');
    L.push(instruction||'（未填写具体要求，请只做最保守的语句通顺化处理）');
    L.push('');
    L.push(modeDesc);
    L.push('');
    L.push('【待修改文本】');
    L.push(payload);
    L.push('');

    // 按「修改要求 + 章节信息」自动挑参考，只取前 2 条（改稿不宜塞太多）
    const rgb=guidePromptBlock(pickGuide(reviseGuideQuery(instruction,ch,payload),2));
    if(rgb){ L.push(rgb); L.push(''); }

    L.push('【硬性约束】');
    L.push('- 只输出修改后的正文文本，不要任何解释、说明、注释或前后缀；');
    L.push('- 不要使用 Markdown 格式（不要 ** 加粗、不要 # 标题、不要 ``` 代码块）；');
    L.push('- 保留原有的分段方式，段落之间空一行；');
    L.push('- 保持第三人称叙述视角与原文语气，不要改变人称；');
    L.push('- 不要写「以下是修改后的内容」这类引导语，直接给正文。');
    if(mode==='polish'){
      L.push(`- 润色后篇幅应与原文接近（原文约 ${countWords(payload)} 字），不要大幅扩写。`);
    }else if(mode!=='selection'&&targetKeep){
      L.push(`- 修改后篇幅控制在 ${fmt(targetKeep)} 字左右。`);
    }
    return L.join('\n');
  }
};

/* ---------- 旧版项目检测与导入 ----------
   早期版本工作台的数据存在另一个键里。
   本工作台用独立键，所以两者互不覆盖；这里只做「发现即提示、点一下即可搬过来」。 */
function legacyProject(){
  if(DB._legacyIgnored) return null;
  for(const k of OLD_KEYS){
    try{
      const raw=localStorage.getItem(k);
      if(!raw) continue;
      const d=JSON.parse(raw);
      if(!d||!Array.isArray(d.chapters)) continue;
      const chars=d.chapters.reduce((s,c)=>s+((c.content||'').length),0);
      return {
        key:k,
        title:(d.theme&&d.theme.title)||'（未命名）',
        chapters:d.chapters.length,
        chars, data:d
      };
    }catch(e){ /* 坏数据直接跳过 */ }
  }
  return null;
}
function importLegacy(){
  const l=legacyProject();
  if(!l){ toast('没有可导入的旧项目'); return; }
  const d=l.data;
  const o=mergeDefaults(d);
  // 旧项目的摘要结构与本版兼容；若存在摘要则原样带过来
  if(d.summaryCfg) o.summaryCfg=Object.assign(structuredClone(DEFAULT_SUM),d.summaryCfg);
  if(!o.theme.title) o.theme.title=l.title;
  DB=o;
  DB._legacyImportedAt=new Date().toISOString();
  curChap=Math.max(0,Math.min(o.ui&&o.ui.curChap||0,Math.max(0,o.chapters.length-1)));
  lastDraft=(o.pending&&o.pending.draft)||'';
  lastOutline=(o.pending&&o.pending.outline)||'';
  lastSparks=(o.pending&&o.pending.sparks)||'';
  saveNow(); render();
  toast(`已导入《${l.title}》 ${l.chapters} 章`);
  log(`从旧版导入项目：${l.title}（${l.chapters} 章）`);
}

/* ---------- AI 写作 ---------- */
let curChap=0;
V.write=()=>{
  if(!DB.chapters.length){
    return `<div class="view-head"><h2>AI 写作</h2></div>
      <div class="empty">还没有章节。<br><br>
      <button class="btn primary" data-go="outline">先去建立章节表</button></div>`;
  }
  if(curChap>=DB.chapters.length){curChap=DB.chapters.length-1;rememberUI();}
  const c=DB.chapters[curChap], wc=countWords(c.content||'');
  const all=DB.chapters.reduce((s,x)=>s+countWords(x.content||''),0);
  const a=activeCfg('draft_llm');
  const target=DB.theme._wordTarget||3000;
  const short = wc>0 && wc < target*0.7;

  return `
  <div class="view-head"><h2>AI 写作</h2>
  <p>第三步。AI 会依据架构、大纲、前文与前情生成正文。生成结果先进入预览区，你确认后再写入正文框。</p></div>

  <div class="row" style="margin-bottom:13px">
    <select id="chapSel" style="max-width:340px">
      ${DB.chapters.map((x,i)=>`<option value="${i}" ${i===curChap?'selected':''}>
        第 ${i+1} 章 ${x.title?'· '+x.title:''}</option>`).join('')}
    </select>
    <span class="pill" id="wcNow">本章 ${fmt(wc)} 字</span>
    <span class="pill" id="wcAll">全书 ${fmt(all)} 字</span>
    <span class="pill">目标 ${fmt(target)} 字</span>
  </div>

  <div class="card">
    <div class="card-t">
      <span>AI 生成正文
        <span class="hint">${a?esc(a.name)+' · '+esc(a.cfg.model_name):'未配置模型'}</span></span>
      <span class="row">
        <button class="btn" id="btnBuildPrompt">查看提示词</button>
        <button class="btn primary" id="btnGenChapter" ${a?'':'disabled'}>生成第 ${curChap+1} 章</button>
      </span>
    </div>
    <div class="field"><label class="f">本章额外指导（可选，会附加到提示词）</label>
      <textarea rows="2" id="chapGuide" placeholder="例如：这一章的重点是母亲不说话的那三个动作，不要解释她的心理">${esc(c.guide||'')}</textarea></div>
    <div class="row" id="chapGuideChips" style="margin-top:7px;gap:6px;flex-wrap:wrap;align-items:center">
      ${chapGuideChipHtml(c.guide||'')}
    </div>
    <div class="ai-meta" id="chapMeta"></div>
    <div class="ai-out" id="chapOut"></div>
    <div class="row" style="margin-top:11px" id="chapActions" hidden>
      <button class="btn primary" id="btnApplyDraft">写入正文</button>
      <button class="btn" id="btnAppendDraft">追加到正文末尾</button>
      <button class="btn" id="btnCopyDraft">复制</button>
      <span class="hint" style="font-size:11px;color:var(--ink-3)" id="draftWc"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-t"><span>本章正文</span>
      <span class="row">
        ${short?`<button class="btn" id="btnExpand">扩写到 ${fmt(target)} 字</button>`:''}
        <button class="btn" id="btnReview">一致性审校</button>
        <button class="btn" id="btnSummary">生成本章摘要</button>
        <button class="btn primary" id="btnFinalize">定稿本章</button>
      </span></div>
    <textarea class="ms" id="ms" data-bind="chapters.${curChap}.content"
      placeholder="可以直接手写，也可以用上方 AI 生成后写入……">${esc(c.content||'')}</textarea>
    <div class="ai-meta" id="msMeta"></div>
    <div class="ai-out" id="auxOut"></div>
  </div>

  <div class="card">
    <div class="card-t">
      <span>AI 修订本章
        <span class="hint">在已写好的草稿上增删改，不必重写全章</span></span>
      <span class="row">
        <span class="pill" id="selInfo" style="background:var(--panel-2)">未选中文本</span>
      </span>
    </div>

    <div class="field">
      <label class="f">修改要求 <span style="color:var(--ink-3)">— 越具体越好，直接说想改什么</span></label>
      <textarea rows="3" id="revInstruction" placeholder="例如：&#10;· 把第二段那段独白删掉，改成他用动作表现（点燃一支烟，又摁灭）&#10;· 在「你确定吗」之后增加一段他犹豫的细节，约 200 字&#10;· 结尾太快了，补一个他走出大楼、天已经黑的过渡&#10;· 场景描写太空，加两处气味和声音">${esc(c._revNote||'')}</textarea>
      <div class="row" id="revGuideChips" style="margin-top:7px;gap:6px;flex-wrap:wrap">
        ${revGuideChipHtml(c._revNote||'')}
      </div>
    </div>

    <div class="grid3">
      <div class="field"><label class="f">修改模式</label>
        <select id="revMode">
          <option value="selection">局部修订（仅改选中的片段）</option>
          <option value="full">整章重写（按要求重写全章）</option>
          <option value="insert">增写情节（在文中插入新段落）</option>
          <option value="cut">删改情节（删除／压缩指定内容）</option>
          <option value="polish">润色改写（只改语言，不动情节）</option>
        </select></div>
      <div class="field"><label class="f">修改后目标字数</label>
        <input type="number" id="revTarget" value="${target}" step="500"></div>
      <div class="field"><label class="f">使用模型</label>
        <input type="text" value="${a?esc(a.name)+' · '+esc(a.cfg.model_name):'未配置模型'}" disabled
          style="background:var(--panel-2);color:var(--ink-2)"></div>
    </div>

    <div class="alert" id="selTip" style="display:none;background:var(--blue-soft);color:var(--blue);border:1px solid #b5d4f4;margin:0 0 11px"></div>

    <div class="row">
      <button class="btn primary" id="btnRevise" ${a&&wc?'':'disabled'}>执行修订</button>
      <button class="btn" id="btnRevisePrompt">查看提示词</button>
      <button class="btn" id="btnRevUseSel">把选中内容填入要求框</button>
      <span style="flex:1"></span>
      <span class="hint" style="font-size:11px;color:var(--ink-3)"></span>
    </div>
    ${!wc?`<div class="alert warn" style="margin:11px 0 0">本章还没有正文，请先用上方生成或手写内容，再来修订。</div>`:''}

    <div class="ai-meta" id="revMeta"></div>
    <div class="row" id="revViewBar" hidden style="margin:10px 0 0;gap:12px">
      <span class="diff-legend">
        <i class="d">删去</i><i class="a">增添</i>
      </span>
      <span id="revStat" style="font-size:12px;color:var(--ink-3)"></span>
      <span style="flex:1"></span>
      <button class="btn sm" id="btnRevToggle">切换为纯文本</button>
    </div>
    <div class="ai-out" id="revOut"></div>
    <div class="row" style="margin-top:11px" id="revActions" hidden>
      <button class="btn primary" id="btnApplyRevise">应用到正文</button>
      <button class="btn" id="btnCopyRevise">复制</button>
      <span class="hint" style="font-size:11px;color:var(--ink-3)" id="revWc"></span>
    </div>
    <div class="row" style="margin-top:9px">
      <button class="btn sm" id="btnRevUndo" ${(reviseUndo&&reviseUndo.chapterNo===curChap+1)?'':'hidden'}>撤销上一次修订</button>
    </div>
  </div>

  <div class="card">
    <div class="card-t">
      <span>前文摘要</span>
      <span class="row">
        <button class="btn sm" id="btnRebuildSum">重算汇总</button>
        ${(DB.summaryCfg&&DB.summaryCfg._undo)?`
        <button class="btn sm" id="btnUndoClearSum">撤销清空（${esc(formatClearTime(DB.summaryCfg._undo.at))}）</button>`:''}
        <button class="btn sm danger" id="btnClearAllSum" ${hasAnySummary()?'':'disabled'}>清空整体摘要</button>
        <button class="btn sm" id="btnToggleSumMode">${(DB.summaryCfg||DEFAULT_SUM).mode==='manual'?'切换为自动汇总':'切换为手动编辑'}</button>
      </span>
    </div>
    <div id="sumClearPanel" hidden></div>
    <div id="sumInfo">${summaryInfoHtml()}</div>
    <div id="sumDiffNote" style="font-size:12px;margin-top:8px"></div>

    <div class="field" style="margin-top:12px">
      <label class="f">本章摘要 <span style="color:var(--ink-3)">— 单章独立保存，是整体摘要的组成单元</span></label>
      <textarea rows="4" id="chapSumBox" placeholder="点上方「生成本章摘要」自动生成。这一份只描述本章，不会被后续章节改写，所以不会漂移。">${esc(c.sum||'')}</textarea>
      <div class="row" style="margin-top:7px">
        <button class="btn sm" id="btnSaveChapSum">保存本章摘要</button>
        <button class="btn sm" id="btnClearChapSum">清空本章</button>
        <span class="hint" style="font-size:11px;color:var(--ink-3)" id="chapSumWc">${countWords(c.sum||'')} 字</span>
      </div>
    </div>

    ${(DB.summaryCfg||DEFAULT_SUM).mode==='manual'?`
    <div class="field">
      <label class="f">整体摘要（手动模式）<span style="color:var(--ink-3)"> — 手动模式下 AI 会读这一段</span></label>
      <textarea rows="6" id="sumPreview" placeholder="手动写整段摘要……">${esc(buildSummaryText())}</textarea>
    </div>`:`
    <div class="field">
      <label class="f">整体摘要预览 <span style="color:var(--ink-3)"> — 由各章摘要自动拼装，只读</span></label>
      <textarea rows="6" id="sumPreview" readonly style="background:var(--panel-2)">${esc(buildSummaryText())}</textarea>
      <div class="hint" style="font-size:11px;color:var(--ink-3);margin-top:6px">
        这一段是 AI 生成后续章节时实际读到的内容。想改它，请改对应章节的「本章摘要」。
      </div>
    </div>`}
  </div>`;
};

/* ---------- 模型配置 ---------- */
let cfgTab='llm';
V.model=()=>{
  const names=Object.keys(DB.ai.configs);
  const cur=DB.ai.last_config;
  const c=DB.ai.configs[cur]||{};
  const fmt=c.interface_format||'OpenAI';
  const isLocal=/ollama/i.test(fmt);
  /* 「写作辅助」卡片放在三元之外，两个标签页都显示 */
  const guideCard = `  <div class="card">
    <div class="card-t">写作辅助 <span class="hint">影响提示词里附带什么</span></div>
    <div class="row">
      <button class="btn ${guideAutoOn()?'primary':''}" id="btnGuideAuto">
        ${guideAutoOn()?'✓ 自动匹配写作参考：开':'自动匹配写作参考：关'}
      </button>

/* ---------- 写作参考 ---------- */
/* ============ 写作参考库 ============
   两个维度：g=题材大类，cat=子类（结构/人物/技法…）。
   题材与作品类型对应，写什么题材就先筛什么题材；通用一栏适用于所有题材。 */
const GENRES=['通用','科幻','玄幻','奇幻','武侠','言情','悬疑','恐怖','历史','都市'];

const GUIDE=[
  /* ---------------- 通用 ---------------- */
  {g:'通用',cat:'结构',n:'三幕结构：把「改变」切成三段',
   d:'第一幕建立常态并打破它（约 1/4）；第二幕升级对抗、逼主角付出代价（约 1/2）；第三幕让他用新的自己解决旧的问题（约 1/4）。关键不在比例，而在「每一幕结束时主角的处境都比上一幕更糟，且退路更少」。'},
  {g:'通用',cat:'结构',n:'场景 = 目标 + 冲突 + 转折',
   d:'每个场景都要有人想要什么、有什么挡着、最后发生了什么改变。三者缺一，这个场景就可以删。写完一章后逐场景检查：如果删掉它剧情不变，那它只是氛围，不该占正文章节。'},
  {g:'通用',cat:'结构',n:'场景之后要有「反应」',
   d:'场景（goal→conflict→disaster）之后必须跟一个反应段（reaction→dilemma→decision），否则读者没时间消化，主角变成只会闯祸的木偶。连写三个场景没有反应段，读者会疲劳；连写三段反应没有场景，读者会无聊。'},
  {g:'通用',cat:'结构',n:'中点转折：让主角从被动变主动',
   d:'第二幕中段要有一次「主动选择」——之前他被事件推着走，之后他开始推着事件走。这个选择往往基于一个错误认知，而第三幕的高潮就是纠正它的代价。'},
  {g:'通用',cat:'结构',n:'悬念 vs 惊奇：读者该提前知道多少',
   d:'惊奇是「读者不知道，突然被告知」；悬念是「读者知道，人物不知道」。悬念的张力更持久——读者会一直替人物着急。 Hitchcock 的说法：炸弹在桌下，人物聊天，观众全程不安，这是悬念；炸弹突然爆炸，这只是三十秒的惊奇。长篇靠悬念撑，惊奇只用来点缀。'},
  {g:'通用',cat:'结构',n:'三种结尾：闭合 / 开放 / 回环',
   d:'闭合结尾回答主要问题，给情绪落点（类型小说的默认选择）；开放结尾留一个未解的问题，但必须让「人物已经改变」这件事确定，否则读者会觉得没写完；回环结尾让最后一句呼应第一句，用同一个意象但含义已变。'},
  {g:'通用',cat:'人物',n:'欲望 / 恐惧 / 谎言：人物三件套',
   d:'他想要什么（外在目标）、他怕什么（阻碍他行动的）、他相信什么错的东西（限制他成长的信念）。第三个最难写，也最能让读者记住一个人物。人物弧光就是「谎言被现实击碎」的过程。'},
  {g:'通用',cat:'人物',n:'三种弧光：正向、负向、平坦',
   d:'正向弧光＝击碎谎言（最常见）；负向弧光＝拒绝面对，最终被谎言吞噬（悲剧、反派起源）；平坦弧光＝人物信念不变，但他把信念带进了一个需要它改变的世界，从而改变了世界（群像、系列主角）。先决定用哪一种，再写每一幕。'},
  {g:'通用',cat:'人物',n:'秘密比动机更能撑情节',
   d:'动机解释他为什么出发，秘密决定他什么时候崩。给每个主要人物写一条「他绝不会说出口的事」，然后安排一个场景逼它浮出水面。'},
  {g:'通用',cat:'人物',n:'反派要有一句让人无法反驳的话',
   d:'好的对手不是「坏」，而是「用另一种逻辑也说得通」。给他一句让读者短暂动摇的台词，冲突立刻从善恶对立升级为价值对立。'},
  {g:'通用',cat:'技法',n:'对话写潜台词，不写信息',
   d:'人物不会直接说出自己的目的。让他们谈 A，实际在博弈 B。检验方法：把台词逐句读一遍，如果每句都在传递信息、没有一句在回避或试探，这段对话就是说明书。'},
  {g:'通用',cat:'技法',n:'用动作承载情绪，不用形容词',
   d:'「他很愤怒」是报告，「他把杯子放回去时，杯底磕在桌沿上，又扶了一下」是小说。情绪要通过可被镜头拍到的动作表现。'},
  {g:'通用',cat:'技法',n:'五感配比：不要只写眼睛',
   d:'新手九成句子是视觉。刻意加入嗅觉与触觉——它们最直接、最难防御，也最能唤起记忆。一段环境描写里至少放一个非视觉细节，质感立刻不同。'},
  {g:'通用',cat:'技法',n:'母题复现：同一个意象写三次',
   d:'选一个意象（雨、镜子、某把钥匙），在三个关键时刻各出现一次：第一次是日常，第二次在压力下变形，第三次带着全新的含义回来。三次之后，读者会自动把它读成主题。'},
  {g:'通用',cat:'技法',n:'伏笔：埋的时候要像闲笔',
   d:'伏笔在埋设时不能显眼，回收时才会让人回头看。原则是「第一次出现时至少承担两个功能」——比如某个物件既推进了当下的场景，又暗含后文的用途。'},
  {g:'通用',cat:'技法',n:'节奏：紧张两章，必须有缓冲',
   d:'连续的高强度会让读者麻木。每 2-3 个紧张章节后给一个缓冲章（关系推进、信息揭示、日常质感），下一个高潮才有落差可用。'},
  {g:'通用',cat:'技法',n:'开篇的三种常见失败',
   d:'① 从起床写起（没有张力）；② 先讲三百字世界观（读者还没理由关心）；③ 用梦或回忆杀开场（读者会觉得自己被骗）。可靠的替代：从一个已经出错的动作切入，让世界观在人物应对错误时自然浮现。'},
  {g:'通用',cat:'视角',n:'不可靠叙述者：让读者比叙述者知道得更多',
   d:'第一人称叙述者可以有盲区、有偏见、有他不愿承认的事。让他的判断与读者看到的事实产生裂缝，读者会自动参与解读——这是长篇最省力的沉浸感来源。'},
  {g:'通用',cat:'视角',n:'一个场景只能有一个「脑子」',
   d:'视角跳跃（head-hopping）是最伤沉浸感的错误：上一句在他脑子里，下一句忽然进她的脑子。同一场景内锁死一个视角人物；要换，用分章或空行分隔，别在一段里换。'},
  {g:'通用',cat:'世界',n:'冰山原则：只写露出水面的 1/8',
   d:'你设定的九成不该出现在正文里。读者感知世界的方式是「人物被它限制」，不是「作者介绍它」。检验方法：每条设定都问一句「它在哪个场景里让人物没了选择？」'},
  {g:'通用',cat:'世界',n:'规则要能被违反，才有戏',
   d:'一条没人能违反的规则只是背景。让规则有代价、有例外、有执法者——然后让主角面对「违反一次能救人」的处境。'},
  {g:'通用',cat:'修改',n:'初稿只求写完，不求写好',
   d:'初稿中途反复回头改，是长篇最常见的死法。先把故事写完，获得一个「可以整体判断」的对象，再回头修。修改能力与写作能力是两种能力，不要同时使用。'},
  {g:'通用',cat:'修改',n:'修改分三层，顺序不能颠倒',
   d:'第一层：结构（删场景、调顺序、修因果）；第二层：场景（补冲突、改转折）；第三层：句子（节奏、用词、标点）。先做句子会白费功夫——被删的场景里，句子再美也没用。'},
  {g:'通用',cat:'修改',n:'删掉前 30%',
   d:'绝大多数初稿的真正开头在第三、四章。前 30% 往往在「暖身」，藏着大量解释性内容。把前 30% 砍掉三分之一试试，故事常常立刻变快。砍之前先备份。'},
  {g:'通用',cat:'修改',n:'朗读一遍，标出你换气的地方',
   d:'句子太长、从句套从句、缺标点——这些在默读时看不出，读出声立刻暴露。凡是读到一半需要换气的地方，就断句。'},

  /* ---------------- 科幻 ---------------- */
  {g:'科幻',cat:'设定',n:'单一变量推演：只改一件事',
   d:'好的科幻通常只改变现实中的一个变量（一项技术、一条物理法则、一次历史分叉），然后严格推演它的全部后果。改得越多，逻辑越容易崩，读者越不信。动笔前问自己：我改的到底是哪一件？'},
  {g:'科幻',cat:'设定',n:'设定硬化程度：硬科幻与软科幻是两种写法',
   d:'硬科幻把技术当主角，读者期待自洽的物理解释；软科幻把技术当舞台，重点在社会与人心。最糟的是「中间态」——技术上说不通，却又要装得很严谨。选定一端，然后守住它。'},
  {g:'科幻',cat:'设定',n:'认知陌生化：让熟悉的东西变奇怪',
   d:'科幻的快感来自「重新看见日常」。方法：用外来者视角审视人类习以为常的仪式（葬礼、上班、恋爱），把它当成一种陌生的风俗来描述。不要评论，只描述。'},
  {g:'科幻',cat:'设定',n:'技术的社会摩擦，才是故事发生的地方',
   d:'技术本身不产生故事，技术撞上制度、习俗、利益才产生故事。写「这项技术出现了」很无聊；写「这项技术让某个职业消失了，而那个人还没找到新身份」才有戏。'},
  {g:'科幻',cat:'技法',n:'解释的时机：先让人物用，再让读者懂',
   d:'不要在设定第一次出现时解释它。先让人物熟练地使用（读者靠上下文猜），在他遇到麻烦、必须解释的那一刻，才把原理说出来——此时读者有求知欲，说明才不烦人。'},
  {g:'科幻',cat:'技法',n:'大尺度时间，要落在人的尺度上',
   d:'动辄万年、光年的叙事容易空转。让宏大尺度只做背景，前景始终是具体的人在做具体的选择（今天要不要回那条消息）。读者只能对一个人的晚饭共情，不能对银河系共情。'},
  {g:'科幻',cat:'结构',n:'第一次接触：难点不是语言，是意图',
   d:'外星/异类的第一次接触，真正的戏剧在于「双方都无法确认对方的意图」。不要急着翻译成功，要让误读持续得足够久，每一个善意的举动都被读成威胁。'},
  {g:'科幻',cat:'结构',n:'反乌托邦的三个陷阱',
   d:'① 反派太蠢（制度只要一个聪明人就能推翻）；② 主角的觉醒太轻易（听一段演讲就反了）；③ 世界只有压抑没有快乐（读者会怀疑为什么没人反抗）。修补方法：给制度一个真实的合理性，给顺从者一个体面的理由。'},
  {g:'科幻',cat:'结构',n:'提问法：如果……会怎样',
   d:'科幻的引擎是一个具体的「如果」。不要停在概念层面，一路问下去：如果记忆可以买卖 → 谁在卖 → 为什么卖 → 买来做什么 → 社会怎么防止伪造 → 谁在监管、谁在钻空子。问到第五层，故事就出来了。'},

  /* ---------------- 玄幻 / 仙侠 ---------------- */
  {g:'玄幻',cat:'体系',n:'力量体系先写「成本」，再写「强度」',
   d:'读者不在乎主角有多强，在乎他为了变强付出什么。每条力量路径都要有明确的代价（寿命、记忆、人性、亲缘）。没有成本的力量体系，所有冲突都会失效。'},
  {g:'玄幻',cat:'体系',n:'境界 = 读者的进度条',
   d:'境界划分的本质功能是提供可感知的进步刻度。层级不宜过多（五到九层为宜），每一层必须有质变而非量变，且主角每次突破都要带来一个新的麻烦——否则升级就是自嗨。'},
  {g:'玄幻',cat:'体系',n:'金手指要有限制，否则故事会死',
   d:'无敌的主角没有故事。给金手指三条硬限制（使用次数、触发条件、不可逆的副作用），并让它至少失效一次，逼主角用人的方式解决问题。'},
  {g:'玄幻',cat:'体系',n:'资源逻辑：修真世界的经济学',
   d:'灵石、丹药、功法本质是稀缺资源。想清楚谁产出、谁分配、谁垄断。一旦资源逻辑成立，门派斗争、师徒反目、拍卖会、秘境争夺全都自动有了动机。'},
  {g:'玄幻',cat:'节奏',n:'爽感的本质：预期兑现 + 略微超出',
   d:'爽不是「主角赢了」，是「读者等的那一下来了，而且比想象中更好」。所以必须先建立期待（他被轻视、他被逼到墙角），再延迟兑现（多拖一章），最后给出超出预期的解法。直接赢，没有爽感。'},
  {g:'玄幻',cat:'节奏',n:'日常流水的变奏',
   d:'修炼、炼丹、赶路这些重复桥段，是长篇的骨架也是疲劳源。原则：同类桥段第三次出现时必须变奏——换视角、换代价、换结果。读者能忍受重复，但不能忍受一模一样的重复。'},
  {g:'玄幻',cat:'节奏',n:'地图扩张的节奏',
   d:'从村到城到国到界，每换一次地图都要重置一次「他又是最弱的」。地图扩张的意义不是变大，而是让旧的规则失效、旧的关系重构。如果新地图只是更强的敌人，读者会疲。'},
  {g:'玄幻',cat:'战斗',n:'打斗写判断，不写招式',
   d:'「他一掌拍出，罡风大作」读者记不住。真正抓人的是判断：他为什么选这一招、他判断错了什么、他在第几招意识到自己要输。让读者跟着主角的思路走，招式名只是标点。'},
  {g:'玄幻',cat:'世界',n:'宗门是利益结构，不是背景板',
   d:'门派要有资源来源、晋升通道、派系斗争、对外关系。写清「谁说了算、凭什么、谁不服」，门派内部的戏就能自己长出来，不需要靠反派使坏推动。'},

  /* ---------------- 奇幻 ---------------- */
  {g:'奇幻',cat:'体系',n:'魔法系统三定律（Sanderson）',
   d:'① 读者的理解程度决定他能感受到的解决难度——作者用魔法解决问题时，必须先让读者懂这个魔法的限制；② 限制比能力更有趣；③ 先想清楚代价，再想效果。这三条几乎是西幻设定的通用准则。'},
  {g:'奇幻',cat:'世界',n:'种族不是皮肤，是制度',
   d:'精灵长寿、矮人善锻——这些只是标签。真正让种族立起来的是：长寿者如何面对短命的朋友、锻造公会如何垄断技术、种族之间谁欠谁的钱。让种族差异体现在法律、经济、婚姻制度上。'},
  {g:'奇幻',cat:'世界',n:'神话要留裂缝',
   d:'世界的创世神话不该是标准答案，而该是「有版本的、互相矛盾的、被政治利用过的」。让不同地区对同一件事有不同说法，读者会自己往里填想象。'},
  {g:'奇幻',cat:'结构',n:'旅途结构的疲劳点',
   d:'「出发—遇敌—扎营—再出发」的循环最多撑三段。破解方法：让旅途的目的在中途改变，或者让队伍在中途分裂，或者让「到达目的地」变成一个坏消息。'},
  {g:'奇幻',cat:'技法',n:'魔法要有质感，不能只有光效',
   d:'魔法的描写要落到身体感受与物质后果上：施法后手指发麻、房间里有金属味、墙上的画歪了。只写「一道耀眼的光芒」，读者什么也看不见。'},
  {g:'奇幻',cat:'世界',n:'地图不是装饰，是政治',
   d:'山脉决定贸易路线，河流决定城市位置，关隘决定谁收税。画地图时先问：谁控制了要道、谁被隔在外面、哪两个文明永远打不到对方。地理一旦合理，战争与联盟都有了理由。'},

  /* ---------------- 武侠 ---------------- */
  {g:'武侠',cat:'世界',n:'江湖是关系网，不是地图',
   d:'江湖的实质是一套脱离官方法律的秩序：恩怨、师承、规矩、面子。地图不重要，谁欠谁一条命才重要。写江湖先写清「这里的规矩是什么、谁在维护、破坏规矩的代价」。'},
  {g:'武侠',cat:'世界',n:'武功的政治性',
   d:'一门绝世武功从来不只是武力，它是资源、是继承权、是门派存续的筹码。围绕一门武功的争夺，本质是围绕权力分配的争夺——这比「抢秘籍」深得多。'},
  {g:'武侠',cat:'战斗',n:'一招一式的「重量」',
   d:'武侠的美感来自克制的精确：写清距离、时机、呼吸、兵器的分量。不要写「大战三百回合」，写「他的刀在第三招慢了半寸」。慢半寸，就是全部的戏剧。'},
  {g:'武侠',cat:'人物',n:'「侠」的定义随时代变',
   d:'司马迁的侠是「其言必信，其行必果」；金庸的侠是「为国为民」；古龙的侠是「为自己的原则」。选定你要写哪一种，因为它决定了主角在关键时刻会放弃什么。'},
  {g:'武侠',cat:'战斗',n:'兵器要有辨识度',
   d:'不要给每个角色都配剑。刀是劈，剑是刺，鞭是控距，暗器是偷袭——兵器决定了打斗的语法，也暗示了使用者的性格与出身。让读者看到兵器就知道是谁来了。'},
  {g:'武侠',cat:'世界',n:'武侠真正写的是「人情债」',
   d:'武功解决不了的，才是武侠的核心：救命之恩怎么还、师门血仇要不要报、答应了死人的事能不能反悔。每一笔人情债都要在结尾结清或明确不结，读者要的是这个账。'},

  /* ---------------- 言情 ---------------- */
  {g:'言情',cat:'情感',n:'情感节拍：靠近—退开—再靠近',
   d:'感情线的基本单位是「节拍」，每个节拍包含一次靠近和一次退开。只靠近不退开，感情会平；只退开不靠近，读者会烦。每次退开都要有理由（恐惧、误会、外部压力），而且这个理由要一次比一次更难克服。'},
  {g:'言情',cat:'情感',n:'拉扯的本质是信息不对称',
   d:'读者觉得「拉扯好看」，是因为两个人掌握的信息不同：他知道她喜欢他，她不知道他知道；或者两人都以为对方不喜欢自己。设计感情线，先设计信息差，再设计动作。'},
  {g:'言情',cat:'情感',n:'误会必须符合人物智力',
   d:'最毁好感的写法是「一句话就能解释清楚，但两人就是不解释」。修补方法：让不解释本身有理由——自尊、承诺、怕伤害第三人、说了就会失去对方。误会可以狗血，但理由必须成立。'},
  {g:'言情',cat:'情感',n:'双向暗恋：让读者比两人都急',
   d:'双向暗恋的爽点在于读者掌握全知视角。写法：交替视角，让读者看到两人各自的心事与误判；关键是让「差一点就说出口」的场景重复出现但每次更接近，第三次必须真的说出口。'},
  {g:'言情',cat:'情感',n:'亲密戏的留白',
   d:'写得越满，越像说明书。真正动人的是临界点之前：手停在半空、呼吸变了、谁先移开视线。把镜头交给感官与犹豫，把结果留给读者。'},
  {g:'言情',cat:'结构',n:'冲突三层升级：外部 / 关系 / 自我',
   d:'第一层是外部阻碍（家庭、身份、距离）；第二层是关系内部的裂痕（信任、隐瞒）；第三层是主角自己的问题（不配得感、恐惧亲密）。只写第一层会单薄，三层都写才有厚度。结局必须解决第三层。'},
  {g:'言情',cat:'结构',n:'HE / BE 的铺垫责任',
   d:'结局的合理性不取决于悲喜，取决于铺垫。要 HE，就得在前文埋下「他们有能力解决核心问题」的证据；要 BE，就得在前文埋下「这个问题他们解决不了」的证据。没有铺垫的结局，无论悲喜都会被骂。'},
  {g:'言情',cat:'人物',n:'配角的功能性',
   d:'每个配角都要承担一个功能：推动信息、制造阻碍、映照主角、提供退路。如果一个配角删掉后剧情毫无变化，那他不是配角，是背景。'},
  {g:'言情',cat:'情感',n:'破镜重圆：先写「为什么当初不行」',
   d:'重逢题材最大的坑是：读者会问「那当初为什么要分」。所以前半部必须把分手的原因写成「当时确实无解」，后半部再让那个原因失效（人变了、条件变了、代价付得起了）。否则复合只是强行发糖。'},

  /* ---------------- 悬疑 / 推理 ---------------- */
  {g:'悬疑',cat:'结构',n:'公平游戏：线索必须在明面上',
   d:'推理小说的基本契约：破案所需的全部线索，读者在揭晓前都看到过。可以藏得巧，不能藏得没。揭晓后读者回头看能一一对上，才会佩服；反之只会觉得被骗。'},
  {g:'悬疑',cat:'结构',n:'线索要显眼，但不能刺眼',
   d:'最好的线索是「第一次出现时读者以为是别的用途」。让它在日常场景里承担一个自然的功能（比如一把伞只是在下雨），回收时才显出第二层意义。'},
  {g:'悬疑',cat:'结构',n:'红鲱鱼的道德',
   d:'误导读者是可以的，但必须「公平地误导」——嫌疑人的可疑行为要有合理的非犯罪解释，而不是作者故意隐瞒。若读者发现某人只是被作者拿来凑数，信任就崩了。'},
  {g:'悬疑',cat:'结构',n:'时间线是推理的地基',
   d:'动笔前先画一张精确到小时的时间线表，标出每个人在每个时刻在哪、和谁在一起、有谁知道。绝大多数逻辑漏洞，都是时间线没算清造成的。'},
  {g:'悬疑',cat:'人物',n:'凶手动机的可信度',
   d:'动机不需要高尚，但必须「对那个人来说足够」。检验方法：把动机单独说给一个陌生人听，他会不会说「就为这个？」。若会，就还不够重。'},
  {g:'悬疑',cat:'结构',n:'反转的三种类型：信息 / 认知 / 身份',
   d:'信息反转＝隐瞒的事实被揭露；认知反转＝读者对已知事实的理解被推翻；身份反转＝某人不是他自称的人。第三种最好用但最容易猜到，第一种最稳，第二种最震撼。一章里最多用一个。'},
  {g:'悬疑',cat:'人物',n:'侦探不能比读者聪明太多',
   d:'如果侦探靠读者看不到的直觉破案，读者不会有参与感。让侦探与读者拿到同样的信息，只是他更善于把碎片连起来——并且至少让他错一次。'},
  {g:'悬疑',cat:'人物',n:'助手的作用是替读者提问',
   d:'华生不是累赘，他是读者的代理人：他问出读者想问的蠢问题，让侦探有机会解释而不显得在炫耀。没有助手的侦探小说，解释部分会变成作者对读者说教。'},

  /* ---------------- 恐怖 ---------------- */
  {g:'恐怖',cat:'氛围',n:'恐惧来自「不该存在却存在」',
   d:'怪物本身不可怕，可怕的是它破坏了世界的秩序：死者不该回来、镜子里不该多一个人、时间不该倒流。先建立「正常」，再让一处细节不对，恐惧就成立了。'},
  {g:'恐怖',cat:'氛围',n:'揭示越少越可怕',
   d:'一旦怪物被看清、被解释，恐惧就变成猎奇。把镜头停在「门缝里的影子」「地上多出来的一双鞋」上。读者自己想象出来的东西，永远比你写出来的更可怕。'},
  {g:'恐怖',cat:'技法',n:'日常的错位',
   d:'最有效的恐怖场景是熟悉的日常差了一点点：家里的餐桌多摆了一副碗筷、母亲叫你的小名但语气不对。不写血，写「不对劲」，读者的汗毛会自己立起来。'},
  {g:'恐怖',cat:'技法',n:'身体恐怖的使用限度',
   d:'身体恐怖见效快，但容易让人反感而非恐惧。控制在「少量、关键处、有心理依据」——身体的异变应当在象征主角的失控，而不是单纯的视觉刺激。'},
  {g:'恐怖',cat:'结构',n:'恐怖的三段式：常态 / 异变 / 确认',
   d:'先花足够篇幅建立「正常」（越具体越好），再放一处说不通的小细节（异变），最后让主角确认它真的存在（确认）。三段的比例约为 4:2:1。跳过第一段，后面的恐怖就没有落差。'},
  {g:'恐怖',cat:'世界',n:'给恐怖设一条规则，然后让主角违反它',
   d:'「午夜后不要开门」「不要回应第三次呼唤」——规则让恐惧有形状，也让读者能预判危险。真正的恐怖发生在主角不得不违反规则的那一刻，而不是怪物出现的那一刻。'},

  /* ---------------- 历史 / 架空 ---------------- */
  {g:'历史',cat:'质感',n:'时代质感来自「限制」',
   d:'读者判断一个时代真不真，看的是人物「不能做什么」：不能随意出行、不能和异性独处、不能直呼上位者的名字。写清这些限制，时代感自己就出来了，比堆砌服饰名词有效十倍。'},
  {g:'历史',cat:'结构',n:'制度逻辑先于事件',
   d:'历史事件背后是制度与利益。写之前先想清楚：钱从哪来、兵听谁的、官怎么升、法由谁解释。制度对了，人物的每一个选择都会显得必然。'},
  {g:'历史',cat:'技法',n:'语言分层：不同阶层不该说同一种话',
   d:'帝王、文官、商人、农夫、仆役的用词、句长、礼节都不同。不需要写成古文，但要有区分：上位者句子短且少解释，下位者多敬语多试探。一句台词就能立住身份。'},
  {g:'历史',cat:'世界',n:'架空也要有经济',
   d:'虚构王朝也需要税收、粮价、盐铁、军费。一旦涉及战争或政变，先问「钱够不够」。经济是架空世界可信度的底盘，也是最好的冲突来源。'},
  {g:'历史',cat:'人物',n:'别让古人说现代话',
   d:'最容易出戏的不是词汇，是观念：个人权利、恋爱自由、平等意识、心理健康——这些现代默认值放进古代人物嘴里会立刻失真。让人物用他那个时代的逻辑思考，哪怕你不同意他。'},
  {g:'历史',cat:'结构',n:'大事件要从小人物身上过',
   d:'写战争不要写战报，写一个辎重兵在撤退路上丢了一只鞋。历史小说的说服力来自「大事件在具体身体上留下的痕迹」，而不是事件本身的规模。'},

  /* ---------------- 都市 / 现实 ---------------- */
  {g:'都市',cat:'结构',n:'生活流的张力从哪来',
   d:'没有大反派的故事，张力来自「不可兼得」：想要晋升就得牺牲陪伴，想守住底线就会失去机会。把两个都合理的选择摆在一起，读者会替人物难受。'},
  {g:'都市',cat:'质感',n:'职业细节的可信度',
   d:'写某个行业，至少要掌握三件外行不知道的具体事（流程、黑话、常见的坑）。这三件事会让整本书的可信度提升一个档次。查资料的成本远低于编造被识破的代价。'},
  {g:'都市',cat:'技法',n:'口语化程度要统一',
   d:'对话太书面会假，太像真实口语（大量「那个」「就是说」）会难读。折中：保留口语的语序和省略，删掉无意义的填充词。读起来像人说的，但不是录音。'},
  {g:'都市',cat:'结构',n:'现实题材的「意义」问题',
   d:'现实题材没有类型小说的天然终点（打败反派、破案、在一起）。所以要提前决定：这本书结束时，主角对生活的理解发生了什么变化？用一个具体的、可验证的事件来承载这个变化，而不是靠感慨收尾。'},
  {g:'都市',cat:'质感',n:'空间感：让城市有具体的坐标',
   d:'不要只写「城市」。写清通勤要多久、房租占收入多少、哪条街晚上没人、便利店几点关门。人物被空间限制的方式，就是他阶层的说明。'},
  {g:'都市',cat:'结构',n:'副线要压主线，不能只是陪衬',
   d:'好的副线会在某个节点逼主角做选择：要么放弃主线目标，要么伤害副线里的人。如果副线和主线永不冲突，那它只是填充字数。'}
];
let libTab='guide';
let libGenre='全部';

/* 从「作品信息 → 类型」里猜一个题材，用于在筛选条上标记「你的」 */
function guessGenre(){
  const t=(DB.theme&&DB.theme.genre||'').toLowerCase();
  if(!t) return '';
  const MAP=[
    ['科幻',['科幻','太空','星际','赛博','赛博朋克','未来','末世','废土','硬科幻','软科幻']],
    ['玄幻',['玄幻','仙侠','修真','修仙','东方','练气','洪荒']],
    ['奇幻',['奇幻','西幻','魔幻','魔法','龙与']],
    ['武侠',['武侠','江湖','侠','古装']],
    ['言情',['言情','爱情','恋爱','情感','甜宠','虐恋','纯爱','耽美','百合']],
    ['悬疑',['悬疑','推理','侦探','犯罪','谍战','破案','刑侦']],
    ['恐怖',['恐怖','灵异','怪谈','惊悚','鬼','悬疑惊悚']],
    ['历史',['历史','架空历史','古代','年代','民国','穿越']],

  for(const [g,ks] of MAP) if(ks.some(k=>t.includes(k))) return g;

}

/* 同义词扩展：让「伏笔」也能搜到讲「线索/铺垫」的条目 */
const LIB_SYN={

  '开篇':['开头','起手','第一句','第一章','开场'],
  '节奏':['张弛','速度','快慢','疲劳'],
  '世界观':['设定','规则','体系','世界'],
  '对话':['台词','对白','潜台词'],
  '人物':['角色','主角','配角','反派'],
  '结尾':['结局','收尾','终点','结局'],
  '修改':['改稿','修订','重写','删'],
  '视角':['人称','第一人称','第三人称','叙述'],
  '爽感':['爽','打脸','升级','金手指'],
  '感情':['情感','恋爱','爱情','言情'],
  '推理':['悬疑','侦探','破案','案件'],
  '设定':['世界观','体系','规则'],
  '力量':['体系','境界','等级','修炼'],
  '战斗':['打斗','对打','交手','武'],
  '历史':['古代','年代','王朝','朝代']
};
function libTerms(q){
  q=String(q||'').trim().toLowerCase();
  if(!q) return [''];
  const set=new Set([q]);
  for(const k in LIB_SYN){
    const ks=k.toLowerCase();
    const vs=LIB_SYN[k].map(x=>x.toLowerCase());
    if(ks.includes(q)||q.includes(ks)||vs.some(x=>x.includes(q)||q.includes(x))){
      set.add(ks); vs.forEach(x=>set.add(x));
    }
  }
  return [...set];
}

/* ============ 参考自动匹配 ============
   目标：生成正文 / 改稿时，从 GUIDE 里挑出 1-3 条最相关的，
   拼进提示词。原则是「宁缺毋滥」——信号不足时不注入，避免噪声干扰。 */
const GUIDE_STOP=new Set(['的','了','是','在','和','与','就','都','而','也','这','那','有','不',
  '人','一','个','上','中','为','以','到','会','要','他','她','它','我','你','们','说','做',
  '但','很','更','最','可','能','没','被','把','给','让','对','从','向','等','着','过','地','得']);
/* 连接词与虚指代词：作为二字组出现时同样没有区分度 */
const GUIDE_STOP2=new Set(['然后','所以','因为','但是','如果','就是','还有','这个','那个','我们','他们',
  '你们','一个','可以','需要','这样','那样','时候','已经','还是','只是','不是','没有','什么','怎么',
  '自己','一点','一些','起来','出来','下来','过来','一起','以后','以前','之后','之前']);

/* 中文用二字组切片，比单字更具体，也不需要分词词典 */
function guideGrams(str){
  const norm=String(str||'').toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]+/g,'');
  const out=new Set();
  for(let i=0;i<norm.length-1;i++){
    const a=norm[i], b=norm[i+1];
    if(GUIDE_STOP.has(a)&&GUIDE_STOP.has(b)) continue;
    if(GUIDE_STOP2.has(a+b)) continue;
    out.add(a+b);
  }
  if(norm.length===1) out.add(norm);
  return out;
}

/* 全库词频表（IDF 用）：罕见词命中比常见词更有信息量。
   没有它的话，长查询会被大量「读者/人物/情节」这类泛词稀释，
   真正关键的「开篇」「误会」反而被阈值挡掉。 */
let GUIDE_DF=null;
function guideIndex(){
  if(GUIDE_DF) return GUIDE_DF;
  GUIDE_DF=new Map();
  GUIDE.forEach(e=>{
    const gs=guideGrams(e.g+' '+e.cat+' '+e.n+' '+e.d);
    gs.forEach(g=>GUIDE_DF.set(g,(GUIDE_DF.get(g)||0)+1));
  });
  return GUIDE_DF;
}
function gramWeight(g){
  const df=guideIndex().get(g)||0;
  // 未出现过的词不贡献；出现越少权重越高
  if(!df) return 0;
  return Math.log((GUIDE.length+1)/(df+0.5));
}

/* df 超过此值视为「泛词」：在 10% 以上的条目里都出现，
   区分度太低（读者/主角/人物/解释…），参与匹配只会制造噪声。 */
const GUIDE_DFCUT=8;

function guideScore(entry,qGrams,qRaw,genre){
  const eG=guideGrams(entry.g+' '+entry.cat+' '+entry.n+' '+entry.d);
  const tG=guideGrams(entry.n);            // 标题最能代表该条目的主题
  let w=0,hit=0,titleHit=false;
  qGrams.forEach(g=>{
    if(!eG.has(g)) return;
    const df=guideIndex().get(g)||0;
    if(df>=GUIDE_DFCUT) return;            // 泛词不计数
    w+=gramWeight(g); hit++;
    if(tG.has(g)) titleHit=true;
  });
  if(!hit) return {s:0,hit:0,titleHit:false};

  const total=entry._qw||1;
  let s=w/Math.sqrt(total);

  if(genre){
    if(entry.g===genre) s*=1.55;
    else if(entry.g==='通用') s*=1.10;
    else s*=0.80;
  }
  if(qRaw.includes(entry.cat)) s*=1.6;
  if(titleHit) s*=1.35;

  return {s,hit,titleHit};
}

/* 返回 [{...entry, score}]，按相关度排序 */
function matchGuide(query,opts){
  const cfg=Object.assign({limit:3,min:0.42},opts||{});
  const raw=String(query||'').trim();
  // 信号太弱：少于 8 字基本无从判断，宁可不动手
  if(raw.length<8) return [];

  const genre=guessGenre();
  /* 注意：这里**不做**同义词扩展。
     扩展是给搜索框设计的（用户明确在找某个词），
     但用于自动匹配会发散——例如查询里的「主角」会扩出「反派」，
     结果把「反派要有一句话」塞进一个毫不相关的科幻章。 */
  const qg=guideGrams(raw);
  if(qg.size<3) return [];

  // 查询侧的总权重（分母）。泛词不计入，否则长查询会被稀释
  let qw=0;
  qg.forEach(g=>{ const df=guideIndex().get(g)||0; if(df>0&&df<GUIDE_DFCUT) qw+=gramWeight(g); });
  if(qw<=0) return [];

  const scored=GUIDE.map(e=>{
    e._qw=qw;
    const r=guideScore(e,qg,raw,genre);
    delete e._qw;
    return {e,s:r.s,hit:r.hit,titleHit:r.titleHit};
  })
    // 题材硬过滤：已知类型时，只保留同题材与通用，绝不跨题材塞技巧
    .filter(x=>!genre || x.e.g===genre || x.e.g==='通用')
    // 收录门槛：至少 2 个有效词命中，或 1 个命中且命中词出现在标题里
    .filter(x=> (x.hit>=2 || x.titleHit) && x.s>=cfg.min)
    // 连类型都没填时，仅凭内容词更难判准，抬高门槛
    .filter(x=> genre ? true : (x.hit>=2 && x.s>=0.75))
    .sort((a,b)=>b.s-a.s);
  if(!scored.length) return [];

  // 同一子类最多 2 条，防止 3 条全是「技法」
  const out=[],catN={};
  for(const {e,s} of scored){
    if((catN[e.cat]||0)>=2) continue;
    catN[e.cat]=(catN[e.cat]||0)+1;
    out.push(Object.assign({},e,{score:s}));
    if(out.length>=cfg.limit) return out;
  }
  // 条数不够时放宽子类限制补齐
  for(const {e,s} of scored){
    if(out.some(x=>x.n===e.n)) continue;
    out.push(Object.assign({},e,{score:s}));
    if(out.length>=cfg.limit) break;
  }
  return out;
}

/* 当前是否启用（用户可关） */
function guideAutoOn(){
  const ai=DB.ai||{};
  return ai.guideAuto!==false;
}
function guideLimit(){
  const raw=(DB.ai||{}).guideTop;
  const n=Number(raw);
  const v=Number.isFinite(n)?n:3;   // 注意：0 是合法输入，不能用 || 兜底
  return Math.max(1,Math.min(6,Math.round(v)));
}

/* 若开启自动匹配则返回条目，否则空数组 */
function pickGuide(query,limit){
  if(!guideAutoOn()) return [];
  return matchGuide(query,{limit:limit||guideLimit()});
}

/* 拼成提示词段落（空数组返回空串，调用方无需判断） */
function guidePromptBlock(list){
  if(!list||!list.length) return '';
  const L=['【写作参考 · 自动匹配（来自你的参考库）】'];
  L.push('下面几条与本段任务最相关。请在具体字句里落实它们，不要只是复述原则：');
  list.forEach(g=>L.push(`· ${g.n}——${g.d}`));
  return L.join('\n');
}

/* ---- 界面：把「自动匹配了哪几条」显示出来 ---- */
function guideChipsHtml(list,emptyText,prefix){
  if(!guideAutoOn())

  if(!list.length)
    return `<span class="hint" style="font-size:11px;color:var(--ink-3)">${emptyText}</span>`;
  return (prefix?`<span class="hint" style="font-size:11px;color:var(--ink-3)">${prefix}</span>`:'')+
    list.map(g=>`<button class="chip" data-copy="${esc(g.n+'：'+g.d)}" title="${esc(g.d)}">${esc(g.n)}</button>`).join('');
}
function chapGuideChipHtml(guide){

/* 章节生成的检索语：标题 + 简述 + 额外指导 + 类型 */
function chapterGuideQuery(chapNo,guidance){
  const c=DB.chapters[chapNo-1]||{};
  return [c.title,c.summary,guidance,(DB.theme||{}).genre]
    .filter(x=>x&&String(x).trim()).join('。');
}
/* 改稿的检索语：修改要求 + 章节信息（片段本身太长，取前 120 字） */
function reviseGuideQuery(instruction,ch,frag){
  return [instruction,(ch&&ch.title)||'',(ch&&ch.summary)||'',
    String(frag||'').slice(0,120)].filter(x=>x&&String(x).trim()).join('。');
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind){save();}
  if(t.dataset.task){DB.ai.choose[t.dataset.task]=t.value;save();toast('已更新任务分配');}
  if(t.id==='chapSel'){flushSave();curChap=+t.value;rememberUI();save();render();}
  if(t.id==='wordTarget'){DB.theme._wordTarget=+t.value||3000;save();toast('已更新单章目标');}
  // TXT 导出选项变化 → 保存并刷新统计预览（书名不影响统计，仅保存）
  if(['txtScope','txtIndent','txtSep','txtTitlePage'].includes(t.id)){
    readTxtOpts(); render();
  }else if(t.id==='txtHead'){
    readTxtOpts();
  }
  if(t.id==='fileImport'){
    const f=t.files&&t.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object') throw new Error('格式不符');
      DB=mergeDefaults(d);
      route=(DB.ui&&V[DB.ui.route])?DB.ui.route:'dash';
      curChap=Math.max(0,Math.min(DB.ui.curChap||0,Math.max(0,DB.chapters.length-1)));
      lastDraft=DB.pending.draft||'';lastOutline=DB.pending.outline||'';lastSparks=DB.pending.sparks||'';
      saveNow();render();toast('导入成功');
    }catch(err){alert('导入失败：不是有效的备份文件。\n'+(err.message||''));}};
    r.readAsText(f,'utf-8');t.value='';
  }
});

    if(k==='faction')DB.factions.push({key:'f'+Date.now(),camp:'',name:'新势力',claim:'',proto:'',notes:''});

    return;

/* ==================================================================
   5. 前文摘要：分章摘要 + 自动汇总
   ================================================================== */
/* 参与汇总的章节：有正文，且（已定稿 或 允许纳入草稿） */
function summaryChapters(){
  const cfg=DB.summaryCfg||DEFAULT_SUM;
  const out=[];
  DB.chapters.forEach((c,i)=>{
    if(!(c.content||'').trim()) return;
    if(c.status==='待写') return;
    if(!cfg.includeUnfinal && c.status!=='已定稿') return;
    const s=(c.sum||'').trim();
    if(s) out.push({no:i+1,title:(c.title||'').trim(),text:s});
  });
  return out;
}

/* 拼装整体前文摘要。
   策略：超预算时走「压缩阶梯」——先压缩早期章节的文字量（尽量保住每一章的条目），
   不够再逐级加强，最后才牺牲早期章节的覆盖。这样优先保留「所有章都有代表」，
   而不是粗暴丢掉最早几章（那会丢失开篇埋下的关键设定）。 */
function buildSummaryText(){
  const cfg=DB.summaryCfg||DEFAULT_SUM;
  if(cfg.mode==='manual') return (cfg.manual||'').trim();

  const items=summaryChapters();
  if(!items.length) return '';
  const limit=cfg.maxChars||2000;
  const recent=Math.max(1,cfg.recentChapters||6);

  const full=(it)=>`第${it.no}章${it.title?`《${it.title}》`:''}：${it.text}`;
  const all=items.map(full).join('\n');
  if(all.length<=limit) return all;

  // 首句压缩：截到第一个句末标点，再按 maxLen 截断
  const briefText=(t,maxLen)=>{
    let s=(t.split(/[。！？\n]/)[0]||t).trim();
    if(maxLen>0&&s.length>maxLen) s=s.slice(0,maxLen-1)+'…';
    return s;
  };
  const NOTE='（早期章节已压缩）';

  // 压缩阶梯：越往后压缩越狠、覆盖越少。取第一个能装下的档位。
  const ladder=[
    {keep:recent, brief:60},
    {keep:recent, brief:42},
    {keep:recent, brief:26},
    {keep:Math.max(1,recent-1), brief:42},
    {keep:Math.max(1,recent-2), brief:42},
    {keep:Math.max(1,recent), brief:18}
  ];
  for(const lv of ladder){
    const cut=Math.max(0,items.length-lv.keep);
    const head=items.slice(0,cut), tail=items.slice(cut);
    const lines=head.map(it=>`第${it.no}章：${briefText(it.text,lv.brief)}`)
                 .concat(tail.map(full));
    const body=lines.join('\n');
    const cand=head.length?`${NOTE}\n${body}`:body;
    if(cand.length<=limit) return cand;
  }

  // 阶梯用尽仍超长：从「保留最近 N 章」逐步缩减到 1 章，
  // 保证至少最后一章完整可读，而不是硬截断把末章也切掉。
  for(let k=recent;k>=1;k--){
    const cand='（更早章节的摘要已省略）\n'+items.slice(-k).map(full).join('\n');
    if(cand.length<=limit) return cand;
  }
  // 连单章都超长：压缩该章 + 硬截断兜底
  const last=items[items.length-1];
  let out=`（更早章节的摘要已省略）\n第${last.no}章${last.title?`《${last.title}》`:''}：`
    +briefText(last.text,Math.max(10,limit-30));
  if(out.length>limit){
    out=out.slice(0,Math.max(1,limit-1)).replace(/[\s。，、；：]+$/,'')+'…';
  }
  return out;
}

/* 摘要覆盖范围描述，用于界面提示 */
function summaryCoverage(){
  const items=summaryChapters();
  if(!items.length) return {count:0,nos:[],from:0,to:0,chars:0};
  const nos=items.map(x=>x.no);
  const txt=buildSummaryText();
  return {count:items.length,nos,from:nos[0],to:nos[nos.length-1],chars:txt.length};
}

/* ==================================================================
   6. 文本差异（修订标记：红色=删去，绿色=增添）
   ================================================================== */
function diffMerge(parts){
  const out=[];
  for(const p of parts){
    if(!p.text) continue;
    const last=out[out.length-1];
    if(last&&last.type===p.type) last.text+=p.text;
    else out.push({type:p.type,text:p.text});
  }
  return out;
}

/* 中文标点／空白：吸附到前一个字符，避免标点被单独标成增删而碎片化
   （例：「…见证人」的句号恰好是两段公共字符时，右引号会孤零零标绿） */
const DIFF_PUNCT=/[\s\u3000。，、；：？！「」『』（）〔〕【】《》〈〉…—～·．,.:;?!'"”’\u2018\u2019\u201C\u201D\-\/\\|()\[\]{}]/;

function tokenizeForDiff(text){
  const out=[]; const n=text.length; let i=0;
  while(i<n){
    let t=text[i]; i++;
    while(i<n && DIFF_PUNCT.test(text[i])){ t+=text[i]; i++; }
    out.push(t);
  }
  return out;
}

/* LCS 差异（按 token 比对） */
function lcsDiffTokens(A,B){
  const n=A.length, m=B.length;
  if(!n) return m?[{type:'ins',text:B.join('')}]:[];
  if(!m) return [{type:'del',text:A.join('')}];
  if(n*m>6e6) return [{type:'del',text:A.join('')},{type:'ins',text:B.join('')}];

  const W=m+1;
  const dp=new Uint32Array((n+1)*W);
  for(let i=n-1;i>=0;i--){
    const row=i*W, nxt=(i+1)*W;
    for(let j=m-1;j>=0;j--){
      dp[row+j] = A[i]===B[j] ? dp[nxt+j+1]+1
                : Math.max(dp[nxt+j], dp[row+j+1]);
    }
  }
  const out=[];
  const push=(t,txt)=>{
    const l=out[out.length-1];
    if(l&&l.type===t) l.text+=txt; else out.push({type:t,text:txt});
  };
  let i=0,j=0;
  while(i<n&&j<m){
    if(A[i]===B[j]){ push('same',A[i]); i++; j++; }
    else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){ push('del',A[i]); i++; }
    else { push('ins',B[j]); j++; }
  }
  while(i<n) push('del',A[i++]);
  while(j<m) push('ins',B[j++]);
  return out;
}

/* 先剥公共前后缀，再做 LCS —— 文学文本改动通常局部，这样能把待比对区间压得很小。
   注：不额外「吸收」夹在变化块之间的短公共片段——那样会把同一个字同时标红标绿，
   反而让人分不清到底改没改。未变即不标，才是修订视图该有的语义。 */
function diffChars(a,b){
  a=a||''; b=b||'';
  if(a===b) return a?[{type:'same',text:a}]:[];
  const A=tokenizeForDiff(a), B=tokenizeForDiff(b);

  let s=0;
  const mn=Math.min(A.length,B.length);
  while(s<mn && A[s]===B[s]) s++;
  let ea=A.length, eb=B.length;
  while(ea>s && eb>s && A[ea-1]===B[eb-1]){ ea--; eb--; }

  const out=[];
  if(s>0) out.push({type:'same',text:A.slice(0,s).join('')});
  for(const p of lcsDiffTokens(A.slice(s,ea), B.slice(s,eb))) out.push(p);
  if(ea<A.length) out.push({type:'same',text:A.slice(ea).join('')});
  return diffMerge(out);
}

/* 渲染成带标记的 HTML。片段过多时返回 null，由调用方退回纯文本 */
function renderDiffHtml(parts){
  if(parts.length>4000) return null;
  let html='';
  for(const p of parts){
    if(p.type==='same') html+=esc(p.text);
    else html+=`<span class="${p.type==='del'?'diff-del':'diff-ins'}">${esc(p.text)}</span>`;
  }
  return html;
}

function diffStat(parts){
  let del=0,ins=0;
  for(const p of parts){
    if(p.type==='del') del+=countWords(p.text);
    else if(p.type==='ins') ins+=countWords(p.text);
  }
  return {del,ins,identical:del===0&&ins===0};
}

/* 渲染修订预览：按偏好显示「修订标记」或「纯文本」 */
function renderRevOutput(){
  const out=document.getElementById('revOut');
  if(!out) return;
  if(!lastRevise){ out.textContent=''; return; }
  const bar=document.getElementById('revViewBar');
  const stat=document.getElementById('revStat');
  const tg=document.getElementById('btnRevToggle');
  const useMark=DB.revDiffMode!=='plain';

  let parts=null;
  if(lastRevOriginal) parts=diffChars(lastRevOriginal,lastRevise.text);
  if(parts&&stat){
    const st=diffStat(parts);
    stat.innerHTML = st.identical
      ? '<b>与原文一致</b>（未检测到改动）'
      : `删去 <b class="c-del">${fmt(st.del)}</b> 字 · 增添 <b class="c-ins">${fmt(st.ins)}</b> 字`;
  }
  const html=(useMark&&parts)?renderDiffHtml(parts):null;

  if(html){
    out.innerHTML=html;
    if(tg) tg.textContent='切换为纯文本';
  }else{
    out.innerHTML='';
    out.textContent=lastRevise.text;
    if(parts&&tg) tg.textContent='显示修订标记';
    else if(tg) tg.textContent='切换为纯文本';
  }

}

          cut:'删改情节',polish:'润色改写'}[m]||m;

/* 清理模型可能带出的引导语与 Markdown 包装 */
function cleanReviseText(t){
  let s=(t||'').trim();
  s=s.replace(/^```[a-z]*\n?/i,'').replace(/\n?```$/,'');
  s=s.replace(/^(以下是|这是)(修改|修订|润色|删改|增写)?(后)?的?(正文|内容|文本|片段)[：:]\s*/,'');
  s=s.replace(/^(修改后|修订后|润色后|删改后|增写后)的?(正文|内容|文本|片段)[：:]\s*/,'');
  return s.trim();
}

function applyRevise(){
  if(!lastRevise||!lastRevise.text){toast('没有可应用的修订稿');return;}
  const c=DB.chapters[curChap];
  if(lastRevise.chapterNo!==curChap+1){
    toast('章节已切换，请重新执行修订');return;
  }
  // 记录撤销点
  reviseUndo={chapterNo:curChap+1,content:c.content||''};

  if(lastRevise.selRange){
    const {start,end}=lastRevise.selRange;
    const before=(c.content||'').slice(0,start);
    const after=(c.content||'').slice(end);
    c.content=before+lastRevise.text+after;
    log(`第 ${curChap+1} 章：已替换选中片段`);
  }else{
    c.content=lastRevise.text;
    log(`第 ${curChap+1} 章：已应用整章修订`);
  }
  if(c.status==='待写') c.status='草稿';
  lastRevise=null; save(); render();
  toast('修订已应用到正文');
}

function undoRevise(){
  if(!reviseUndo) return;
  const c=DB.chapters[reviseUndo.chapterNo-1];
  if(!c) return;
  c.content=reviseUndo.content;
  log(`第 ${reviseUndo.chapterNo} 章：已撤销修订`);
  reviseUndo=null; save(); render();
  toast('已撤销上一次修订');
}

function applyOutline(){
  if(!lastOutline){toast('没有可写入的内容');return;}
  // 解析「第n章 - 标题 / 定位：… / 简述：…」
  const blocks=lastOutline.split(/(?=第\s*\d+\s*章)/).filter(s=>/第\s*\d+\s*章/.test(s));
  if(!blocks.length){alert('未能从输出中解析出章节，请检查格式或手动复制。');return;}
  const parsed=blocks.map(bl=>{
    const hm=bl.match(/第\s*(\d+)\s*章\s*[-—–:：]?\s*([^\n]*)/);
    const no=hm?parseInt(hm[1],10):0;
    let title=hm?(hm[2]||'').replace(/[《》「」]/g,'').trim():'';
    const sm=bl.match(/(?:本章)?简述\s*[:：]\s*([^\n]+)/);
    const summary=sm?sm[1].trim():'';
    return {no,title,summary};
  }).filter(x=>x.no>0).sort((a,b)=>a.no-b.no);

  const mode=document.getElementById('outlineMode').value;
  if(mode==='replace'&&!confirm(`将替换现有 ${DB.chapters.length} 章，确定吗？`))return;
  if(mode==='replace')DB.chapters=[];

  let added=0;
  parsed.forEach(p=>{
    const idx=DB.chapters.findIndex((c,i)=>i+1===p.no);
    if(mode==='append'||idx<0){
      while(DB.chapters.length<p.no-1)DB.chapters.push({title:'',summary:'',status:'待写',content:''});
      DB.chapters[p.no-1]={title:p.title,summary:p.summary,status:'待写',content:''};
    }else{
      DB.chapters[idx].title=p.title||DB.chapters[idx].title;
      DB.chapters[idx].summary=p.summary||DB.chapters[idx].summary;
    }
    added++;
  });
  log(`大纲写入 ${added} 章`);lastOutline='';DB.pending.outline='';
  rememberUI();save();render();toast(`已写入 ${added} 章`);
}

    log(`第 ${curChap+1} 章扩写完成，${countWords(text)} 字`);save();
    meta(m,Date.now()-t0,countWords(text));
    render();toast('扩写完成');
  }catch(err){log('扩写失败：'+err.message);showErr(out,'扩写失败：'+err.message);}
  finally{setBusy(btn,false,`扩写到 ${fmt(target)} 字`);}
}
async function runReview(btn){

/* 生成本章摘要 → 存入 chapter.sum → 整体摘要自动重算。
   注意：全程不调用 render()，只做局部 DOM 更新，
   否则会重建视图、把刚流式输出的内容清空。 */
async function runSummary(btn){
  const c=DB.chapters[curChap];
  const out=document.getElementById('auxOut'),m=document.getElementById('msMeta');
  if(!(c.content||'').trim()){toast('本章还没有正文');return;}
  out.innerHTML='';setBusy(btn,true);const t0=Date.now();

  const before=buildSummaryText();       // 改动前的整体摘要，用于对比
  try{
    let text='';
    await callAI({taskKey:'summary_llm',
      prompt:P.chapterSum(c.content||'',curChap+1,c.title||''),
      onDelta:d=>{text+=d;out.innerHTML=`<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:8px">
        <span class="spin"></span> 正在生成本章摘要…</div>`+esc(text);},
      onReason:r=>reasonHook(m,r)});

    c.sum=cleanReviseText(text);         // 复用引导语清洗
    if(c.sum) c.sumUpdated=nowIso();
    save();

    // 局部更新界面，不重建视图
    refreshSummaryUI(before);

    const chars=countWords(c.sum);
    meta(m,Date.now()-t0,chars);
    out.innerHTML=`<div style="font-size:11.5px;color:var(--teal);margin-bottom:8px">
      ✓ 第 ${curChap+1} 章摘要已生成（${fmt(chars)} 字），整体前文摘要已自动重算</div>`
      +esc(c.sum);
    log(`第 ${curChap+1} 章摘要已更新（${chars} 字）`);
    toast('本章摘要已更新');
  }catch(err){
    log('摘要更新失败：'+err.message);
    out.innerHTML='';
    showErr(out,'更新失败：'+err.message);
  }finally{ setBusy(btn,false,'生成本章摘要'); }
}

    }

      const cov=summaryCoverage();
